<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — TransitionForward</title>
    <style>
      :root { color-scheme: light; }
      body {
        font-family: 'Karla', system-ui, -apple-system, sans-serif;
        background: #faf7f2;
        color: #1f2937;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .card { max-width: 28rem; text-align: center; }
      h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 2rem; margin: 0 0 0.5rem; color: #1f4f4a; }
      p { color: #4b5563; line-height: 1.6; }
      button {
        margin-top: 1rem;
        background: #1f4f4a;
        color: #fff;
        border: 0;
        padding: 0.65rem 1.25rem;
        border-radius: 0.5rem;
        font-size: 0.95rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>This page hasn't been saved for offline use yet. Pages you've already visited will still open. Reconnect to load new content.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
