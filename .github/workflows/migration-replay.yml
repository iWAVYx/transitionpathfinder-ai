            PERFORM public.set_document_operation_pause('00000000-0000-4000-8000-000000000007',2,true,'maintenance');
            PERFORM public.finish_document_operation((receipt->>'operation_id')::uuid,'00000000-0000-4000-8000-000000000001',(receipt->>'receipt_id')::uuid,'needs_review');
            IF (public.inspect_document_operation_drain()->>'tracked_operations_clear')::boolean THEN RAISE EXCEPTION 'Uncertain work disappeared'; END IF;
          END; $tracked_work$;
