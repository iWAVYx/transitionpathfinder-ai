          BEGIN
            FOREACH signature IN ARRAY ARRAY['public.begin_document_operation(uuid,uuid,text)','public.finish_document_operation(uuid,uuid,uuid,text)','public.set_document_operation_pause(uuid,bigint,boolean,text)','public.inspect_document_operation_drain()'] LOOP
