      - name: Verify canonical document upload boundaries after complete replay
        run: |
          PGUSER=supabase_admin psql -v ON_ERROR_STOP=1 <<'SQL' > /tmp/document-path-proposal-verification.txt
          DO $verify$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_index
              WHERE indexrelid='public.documents_storage_path_unique'::regclass
                AND indrelid='public.documents'::regclass AND indisunique AND indisvalid
                AND indpred IS NOT NULL
                AND indkey::text=(SELECT attnum::text FROM pg_attribute WHERE attrelid='public.documents'::regclass AND attname='storage_path')
            ) THEN RAISE EXCEPTION 'Expected exclusive path index is missing'; END IF;
            IF EXISTS (
              SELECT 1 FROM pg_proc WHERE oid='public.tg_documents_enforce_storage_path()'::regprocedure
                AND (prosecdef OR proconfig IS DISTINCT FROM ARRAY['search_path=pg_catalog'])
            ) OR has_function_privilege('anon','public.tg_documents_enforce_storage_path()','EXECUTE')
              OR has_function_privilege('authenticated','public.tg_documents_enforce_storage_path()','EXECUTE')
              OR has_function_privilege('service_role','public.tg_documents_enforce_storage_path()','EXECUTE')
            THEN RAISE EXCEPTION 'Unexpected trigger execution boundary'; END IF;
          END;
          $verify$;
          DO $scan_verify$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_trigger WHERE tgrelid='public.documents'::regclass
              AND tgname='documents_guard_scan_state' AND tgenabled='O' AND NOT tgisinternal)
              OR NOT EXISTS (SELECT 1 FROM pg_proc WHERE oid='public.guard_document_scan_state()'::regprocedure
                AND NOT prosecdef AND proconfig=ARRAY['search_path=pg_catalog'])
              OR has_function_privilege('anon','public.guard_document_scan_state()','EXECUTE')
              OR has_function_privilege('authenticated','public.guard_document_scan_state()','EXECUTE')
              OR has_function_privilege('service_role','public.guard_document_scan_state()','EXECUTE')
            THEN RAISE EXCEPTION 'Unexpected scan-state execution boundary'; END IF;
          END;
          $scan_verify$;
          DO $storage_verify$
          BEGIN
            IF (SELECT count(*) FROM pg_policy WHERE polrelid='storage.objects'::regclass
              AND polname IN ('student_document_no_client_replace','student_document_no_client_delete')
              AND NOT polpermissive AND cardinality(polroles)=2 AND polroles @> ARRAY['anon'::regrole::oid,'authenticated'::regrole::oid])<>2
              OR NOT EXISTS (SELECT 1 FROM pg_policy WHERE polrelid='storage.objects'::regclass
                AND polname='student_document_no_client_replace' AND polcmd='w' AND polqual IS NOT NULL AND polwithcheck IS NOT NULL)
              OR NOT EXISTS (SELECT 1 FROM pg_policy WHERE polrelid='storage.objects'::regclass
                AND polname='student_document_no_client_delete' AND polcmd='d' AND polqual IS NOT NULL)
            THEN RAISE EXCEPTION 'Unexpected student storage write boundary'; END IF;
          END;
          $storage_verify$;
          DO $quarantine_verify$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_policy WHERE polrelid='storage.objects'::regclass
              AND polname='student_document_no_blocked_read' AND polcmd='r' AND NOT polpermissive
              AND cardinality(polroles)=2 AND polroles @> ARRAY['anon'::regrole::oid,'authenticated'::regrole::oid])
              OR NOT EXISTS (SELECT 1 FROM pg_proc WHERE oid='public.student_document_not_blocked(text)'::regprocedure
                AND prosecdef AND provolatile='s' AND proconfig=ARRAY['search_path=pg_catalog'])
              OR has_function_privilege('service_role','public.student_document_not_blocked(text)','EXECUTE')
              OR NOT has_function_privilege('authenticated','public.student_document_not_blocked(text)','EXECUTE')
              OR NOT has_function_privilege('anon','public.student_document_not_blocked(text)','EXECUTE')
            THEN RAISE EXCEPTION 'Unexpected retained-file read boundary'; END IF;
          END;
          $quarantine_verify$;
          DO $review_hold_verify$
          DECLARE signature text;
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_policy WHERE polrelid='storage.objects'::regclass
              AND polname='student_document_reserved_insert' AND polcmd='a' AND NOT polpermissive
              AND cardinality(polroles)=2 AND polroles @> ARRAY['anon'::regrole::oid,'authenticated'::regrole::oid])
              OR NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conrelid='public.document_upload_attempts'::regclass
                AND conname='document_upload_attempts_hold_check' AND convalidated)
            THEN RAISE EXCEPTION 'Unexpected review hold/storage insert boundary'; END IF;
            FOREACH signature IN ARRAY ARRAY['public.hold_document_upload_for_review(uuid,text,text)','public.can_insert_reserved_student_document(text,text)'] LOOP
              IF NOT EXISTS (SELECT 1 FROM pg_proc WHERE oid=signature::regprocedure
                  AND prosecdef AND provolatile='v' AND proconfig=ARRAY['search_path=pg_catalog'])
                OR has_function_privilege('anon',signature,'EXECUTE')
                OR has_function_privilege('service_role',signature,'EXECUTE')
                OR NOT has_function_privilege('authenticated',signature,'EXECUTE')
              THEN RAISE EXCEPTION 'Unexpected review hold execution boundary'; END IF;
            END LOOP;
          END;
          $review_hold_verify$;
          DO $extraction_apply_verify$
          DECLARE signature text:='public.apply_reviewed_document_extraction(uuid,uuid,uuid,timestamptz,jsonb,boolean)';
          BEGIN
            IF NOT EXISTS(SELECT 1 FROM pg_proc WHERE oid=signature::regprocedure AND NOT prosecdef AND proconfig=ARRAY['search_path=pg_catalog'])
              OR NOT has_function_privilege('authenticated',signature,'EXECUTE')
              OR has_function_privilege('anon',signature,'EXECUTE') OR has_function_privilege('service_role',signature,'EXECUTE')
            THEN RAISE EXCEPTION 'Unexpected atomic extraction application boundary'; END IF;
          END;
          $extraction_apply_verify$;
          DO $source_binding_verify$
          DECLARE signature text; role_name text; privilege_name text;
          BEGIN
            IF NOT EXISTS(SELECT 1 FROM pg_class WHERE oid='public.document_summary_source_bindings'::regclass AND relrowsecurity)
              OR NOT EXISTS(SELECT 1 FROM pg_trigger WHERE tgrelid='public.document_summary_source_bindings'::regclass AND tgname='document_source_binding_immutable' AND tgenabled='O' AND NOT tgisinternal)
              OR NOT EXISTS(SELECT 1 FROM pg_trigger WHERE tgrelid='public.ai_jobs'::regclass AND tgname='ai_jobs_guard_bound_document_source' AND tgenabled='O' AND NOT tgisinternal)
              OR (SELECT count(*) FROM pg_constraint WHERE conrelid='public.document_summary_source_bindings'::regclass AND contype='f' AND confdeltype='r' AND convalidated)<>3
            THEN RAISE EXCEPTION 'Unexpected retained source binding boundary'; END IF;
            FOREACH role_name IN ARRAY ARRAY['anon','authenticated','service_role'] LOOP
              FOREACH privilege_name IN ARRAY ARRAY['SELECT','INSERT','UPDATE','DELETE','TRUNCATE'] LOOP
                IF has_table_privilege(role_name,'public.document_summary_source_bindings',privilege_name)
                THEN RAISE EXCEPTION 'Unexpected direct source binding table grant'; END IF;
              END LOOP;
            END LOOP;
            FOREACH signature IN ARRAY ARRAY['public.reject_document_source_binding_mutation()','public.guard_bound_document_summary_job()'] LOOP
              IF NOT EXISTS(SELECT 1 FROM pg_proc WHERE oid=signature::regprocedure AND prosecdef AND proconfig=ARRAY['search_path=pg_catalog'])
                OR has_function_privilege('anon',signature,'EXECUTE') OR has_function_privilege('authenticated',signature,'EXECUTE') OR has_function_privilege('service_role',signature,'EXECUTE')
              THEN RAISE EXCEPTION 'Unexpected source binding trigger execution grant'; END IF;
            END LOOP;
          END;
          $source_binding_verify$;
          DO $resolution_claim_verify$
          DECLARE signature text; role_name text; privilege_name text;
          BEGIN
            IF NOT EXISTS(SELECT 1 FROM pg_class WHERE oid='public.document_upload_resolution_claims'::regclass AND relrowsecurity)
              OR NOT EXISTS(SELECT 1 FROM pg_policy WHERE polrelid='public.document_upload_resolution_claims'::regclass AND polname='upload_resolution_creator_read' AND polcmd='r')
              OR NOT EXISTS(SELECT 1 FROM pg_trigger WHERE tgrelid='public.document_upload_attempts'::regclass AND tgname='upload_attempt_resolution_frozen' AND tgenabled='O' AND NOT tgisinternal)
              OR NOT EXISTS(SELECT 1 FROM pg_trigger WHERE tgrelid='public.document_upload_resolution_claims'::regclass AND tgname='upload_resolution_claim_immutable' AND tgenabled='O' AND NOT tgisinternal)
            THEN RAISE EXCEPTION 'Unexpected durable upload claim boundary'; END IF;
            FOREACH signature IN ARRAY ARRAY['public.claim_document_upload_resolution(uuid,text,uuid)','public.guard_claimed_upload_attempt()','public.reject_upload_resolution_claim_mutation()'] LOOP
              IF NOT EXISTS(SELECT 1 FROM pg_proc WHERE oid=signature::regprocedure AND prosecdef AND proconfig=ARRAY['search_path=pg_catalog'])
                OR has_function_privilege('anon',signature,'EXECUTE') OR has_function_privilege('service_role',signature,'EXECUTE')
                OR has_function_privilege('authenticated',signature,'EXECUTE') IS DISTINCT FROM (signature='public.claim_document_upload_resolution(uuid,text,uuid)')
              THEN RAISE EXCEPTION 'Unexpected durable claim execution boundary'; END IF;
            END LOOP;
            FOREACH role_name IN ARRAY ARRAY['anon','authenticated','service_role'] LOOP
              FOREACH privilege_name IN ARRAY ARRAY['INSERT','UPDATE','DELETE','TRUNCATE'] LOOP
                IF has_table_privilege(role_name,'public.document_upload_resolution_claims',privilege_name)
                THEN RAISE EXCEPTION 'Unexpected direct resolution claim mutation grant'; END IF;
              END LOOP;
            END LOOP;
          END;
          $resolution_claim_verify$;
          DO $recovery_read_verify$
          DECLARE signature text := 'public.read_document_upload_recovery(uuid,text)';
          BEGIN
            IF NOT EXISTS(SELECT 1 FROM pg_proc WHERE oid=signature::regprocedure
                AND prosecdef AND provolatile='v' AND proconfig=ARRAY['search_path=pg_catalog'])
              OR has_function_privilege('anon',signature,'EXECUTE')
              OR has_function_privilege('service_role',signature,'EXECUTE')
              OR NOT has_function_privilege('authenticated',signature,'EXECUTE')
            THEN RAISE EXCEPTION 'Unexpected upload recovery read boundary'; END IF;
          END;
          $recovery_read_verify$;
          DO $admission_verify$
          DECLARE signature text := 'public.reserve_document_upload(uuid,uuid,text,text)';
          BEGIN
            IF NOT EXISTS(SELECT 1 FROM pg_proc WHERE oid=signature::regprocedure
                AND prosecdef AND provolatile='v' AND proconfig=ARRAY['search_path=pg_catalog'])
              OR has_function_privilege('anon',signature,'EXECUTE')
              OR has_function_privilege('service_role',signature,'EXECUTE')
              OR NOT has_function_privilege('authenticated',signature,'EXECUTE')
              OR NOT EXISTS(SELECT 1 FROM pg_index WHERE indexrelid='public.document_upload_unresolved_actor'::regclass AND indisvalid AND indpred IS NOT NULL)
              OR NOT EXISTS(SELECT 1 FROM pg_index WHERE indexrelid='public.document_upload_unresolved_student'::regclass AND indisvalid AND indpred IS NOT NULL)
            THEN RAISE EXCEPTION 'Unexpected unresolved admission boundary'; END IF;
          END;
          $admission_verify$;
          DO $binding_verify$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_trigger WHERE tgrelid='public.documents'::regclass
              AND tgname='documents_guard_storage_binding' AND tgenabled='O' AND NOT tgisinternal)
              OR NOT EXISTS (SELECT 1 FROM pg_proc WHERE oid='public.guard_document_storage_binding()'::regprocedure
                AND prosecdef AND proconfig=ARRAY['search_path=pg_catalog'])
              OR has_function_privilege('anon','public.guard_document_storage_binding()','EXECUTE')
              OR has_function_privilege('authenticated','public.guard_document_storage_binding()','EXECUTE')
              OR has_function_privilege('service_role','public.guard_document_storage_binding()','EXECUTE')
              OR (SELECT count(*) FROM pg_attribute WHERE attrelid='public.documents'::regclass
                AND attname IN ('storage_object_id','storage_object_version') AND NOT attisdropped)<>2
            THEN RAISE EXCEPTION 'Unexpected object binding boundary'; END IF;
          END;
          $binding_verify$;
          DO $summary_verify$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_proc WHERE oid='public.can_read_document_summary_job(uuid,uuid,text)'::regprocedure
                AND prosecdef AND proconfig=ARRAY['search_path=pg_catalog'])
              OR has_function_privilege('anon','public.can_read_document_summary_job(uuid,uuid,text)','EXECUTE')
              OR has_function_privilege('service_role','public.can_read_document_summary_job(uuid,uuid,text)','EXECUTE')
              OR NOT has_function_privilege('authenticated','public.can_read_document_summary_job(uuid,uuid,text)','EXECUTE')
              OR (SELECT count(*) FROM pg_policy WHERE polrelid='public.ai_jobs'::regclass
                AND polname IN ('document_summary_explicit_read','document_summary_scoped_request','document_summary_server_update','document_summary_server_delete')
                AND NOT polpermissive AND polroles=ARRAY['authenticated'::regrole::oid])<>4
            THEN RAISE EXCEPTION 'Unexpected document summary job boundary'; END IF;
          END;
          $summary_verify$;
          DO $verified_summary$
          DECLARE signature text;
          BEGIN
            FOREACH signature IN ARRAY ARRAY[
              'public.read_verified_document_summary_source(uuid,timestamptz,integer)',
              'public.complete_verified_document_summary(uuid,timestamptz,integer,uuid,uuid,uuid,uuid,text,text,jsonb,jsonb)'
            ] LOOP
              IF NOT EXISTS (SELECT 1 FROM pg_proc WHERE oid=signature::regprocedure AND prosecdef AND proconfig=ARRAY['search_path=pg_catalog'])
                OR has_function_privilege('anon',signature,'EXECUTE') OR has_function_privilege('authenticated',signature,'EXECUTE')
                OR NOT has_function_privilege('service_role',signature,'EXECUTE') THEN
                RAISE EXCEPTION 'Unexpected verified summary RPC boundary';
              END IF;
            END LOOP;
          END;
          $verified_summary$;
          DO $reservation_verify$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_class WHERE oid='public.document_upload_attempts'::regclass AND relrowsecurity)
              OR NOT EXISTS (SELECT 1 FROM pg_proc WHERE oid='public.reserve_document_upload(uuid,uuid,text,text)'::regprocedure
                AND prosecdef AND proconfig=ARRAY['search_path=pg_catalog'])
              OR has_function_privilege('anon','public.reserve_document_upload(uuid,uuid,text,text)','EXECUTE')
              OR has_function_privilege('service_role','public.reserve_document_upload(uuid,uuid,text,text)','EXECUTE')
              OR NOT has_function_privilege('authenticated','public.reserve_document_upload(uuid,uuid,text,text)','EXECUTE')
              OR has_table_privilege('authenticated','public.document_upload_attempts','INSERT,UPDATE,DELETE')
              OR has_table_privilege('anon','public.document_upload_attempts','SELECT,INSERT,UPDATE,DELETE')
              OR has_table_privilege('service_role','public.document_upload_attempts','INSERT,UPDATE,DELETE')
            THEN RAISE EXCEPTION 'Unexpected upload reservation boundary'; END IF;
          END;
          $reservation_verify$;
          DO $registration_verify$
          DECLARE signature text;
          BEGIN
            IF (SELECT count(*) FROM pg_trigger WHERE tgrelid='public.documents'::regclass
              AND tgname IN ('documents_aa_guard_upload_registration','documents_link_upload_registration') AND tgenabled='O' AND NOT tgisinternal)<>2 THEN
              RAISE EXCEPTION 'Missing document registration guards';
            END IF;
            FOREACH signature IN ARRAY ARRAY['public.guard_document_upload_registration()','public.link_document_upload_registration()','public.read_document_upload_registration(uuid,text)'] LOOP
              IF NOT EXISTS (SELECT 1 FROM pg_proc WHERE oid=signature::regprocedure AND prosecdef AND proconfig=ARRAY['search_path=pg_catalog'])
                OR has_function_privilege('anon',signature,'EXECUTE') OR has_function_privilege('service_role',signature,'EXECUTE')
                OR has_function_privilege('authenticated',signature,'EXECUTE') IS DISTINCT FROM (signature='public.read_document_upload_registration(uuid,text)') THEN
                RAISE EXCEPTION 'Unexpected document registration RPC boundary';
              END IF;
            END LOOP;
          END;
          $registration_verify$;
          SELECT 'Proposals applied and verified in disposable canonical replay only' AS result;
          SQL

      - name: Verify proposed durable admission against complete canonical replay
        run: |
          PGUSER=supabase_admin psql -v ON_ERROR_STOP=1 -f docs/production-readiness/proposals/document-operation-admission.sql
          PGUSER=supabase_admin psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $admission_grants$
          DECLARE signature text; relation_name text; role_name text; privilege_name text;
          BEGIN
            FOREACH signature IN ARRAY ARRAY['public.begin_document_operation(uuid,uuid,text)','public.finish_document_operation(uuid,uuid,uuid,text)','public.set_document_operation_pause(uuid,bigint,boolean,text)','public.inspect_document_operation_drain()'] LOOP
              IF NOT EXISTS(SELECT 1 FROM pg_proc WHERE oid=signature::regprocedure AND prosecdef AND proconfig=ARRAY['search_path=pg_catalog'])
                OR EXISTS(SELECT 1 FROM pg_proc p,LATERAL aclexplode(COALESCE(p.proacl,acldefault('f',p.proowner))) a WHERE p.oid=signature::regprocedure AND a.grantee=0 AND a.privilege_type='EXECUTE')
                OR has_function_privilege('anon',signature,'EXECUTE') OR has_function_privilege('authenticated',signature,'EXECUTE')
                OR NOT has_function_privilege('service_role',signature,'EXECUTE') THEN RAISE EXCEPTION 'Unexpected admission execution boundary'; END IF;
            END LOOP;
            FOREACH relation_name IN ARRAY ARRAY['public.document_operation_control','public.document_operation_leases','public.document_operation_control_events'] LOOP
              IF NOT EXISTS(SELECT 1 FROM pg_class WHERE oid=relation_name::regclass AND relrowsecurity) THEN RAISE EXCEPTION 'Admission RLS required'; END IF;
              FOREACH role_name IN ARRAY ARRAY['anon','authenticated','service_role'] LOOP
                FOREACH privilege_name IN ARRAY ARRAY['SELECT','INSERT','UPDATE','DELETE','TRUNCATE'] LOOP
                  IF has_table_privilege(role_name,relation_name,privilege_name) THEN RAISE EXCEPTION 'Unexpected direct admission table privilege'; END IF;
                END LOOP;
              END LOOP;
            END LOOP;
          END; $admission_grants$;
          BEGIN;
          SET LOCAL ROLE service_role;
          DO $tracked_work$
          DECLARE receipt jsonb;
          BEGIN
            PERFORM public.set_document_operation_pause('00000000-0000-4000-8000-000000000007',1,false,'resume');
            receipt:=public.begin_document_operation('00000000-0000-4000-8000-000000000901','00000000-0000-4000-8000-000000000001','summary');
            PERFORM public.set_document_operation_pause('00000000-0000-4000-8000-000000000007',2,true,'maintenance');
            PERFORM public.finish_document_operation((receipt->>'operation_id')::uuid,'00000000-0000-4000-8000-000000000001',(receipt->>'receipt_id')::uuid,'needs_review');
            IF (public.inspect_document_operation_drain()->>'tracked_operations_clear')::boolean THEN RAISE EXCEPTION 'Uncertain work disappeared'; END IF;
          END; $tracked_work$;
          ROLLBACK;
          SQL
          PGUSER=supabase_admin psql -qAt -v ON_ERROR_STOP=1 -c "SET ROLE service_role;SELECT public.inspect_document_operation_drain();" > /tmp/document-operation-admission.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import {readFileSync} from 'node:fs';
          const x=JSON.parse(readFileSync('/tmp/document-operation-admission.json','utf8'));
          assert.equal(x.schema,'document-operation-drain-v1');assert.equal(x.paused,true);assert.equal(x.revision,1);
          assert.equal(x.tracked_operations_clear,true);assert.equal(x.by_kind.length,4);
          for(const k of x.by_kind){assert.equal(k.active,0);assert.equal(k.needs_review,0);}
