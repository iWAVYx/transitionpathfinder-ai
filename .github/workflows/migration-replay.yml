            FOR expected IN SELECT * FROM (VALUES
              ('public.read_internal_document_registration_completion(uuid)','dc3b28d28174e13759e47896e549a3b8',false),
              ('public.guard_document_registration_completion_receipt()','47defe9db1ab2e654d178d25e8dcb199',false),
              ('public.record_internal_document_registration_completion(uuid)','4b2881100167d594248a391149957ae8',true),
              ('public.guard_registered_document_summary_queue()','0bdef1bb3b14b5e0bb6f341e5464bbeb',true),
              ('public.guard_document_capacity_registration_settlement()','f624d20bfd7c81e6fa2e2f56ac786d60',false),
              ('public.settle_internal_document_registration_capacity(uuid)','174b6e74b5cd821d41f731915b546d73',false),
              ('public.finish_document_operation(uuid,uuid,uuid,text)','e17e9ae509adc829e867f9723a15748d',true),
              ('public.guard_document_capacity_reservation()','fd1a2d66f6a7c7e6a0b6f115a0b71b3a',false)) x(signature,body_md5,definer) LOOP
              IF NOT EXISTS(SELECT 1 FROM pg_proc WHERE oid=to_regprocedure(expected.signature) AND prosecdef=expected.definer
                AND proowner=CASE WHEN expected.signature='public.finish_document_operation(uuid,uuid,uuid,text)' THEN admission_owner ELSE current_user::regrole::oid END
                AND proconfig=ARRAY['search_path=pg_catalog'] AND md5(prosrc)=expected.body_md5) THEN
                RAISE EXCEPTION 'Unexpected registration completion definition or owner';
              END IF;
              FOREACH role_name IN ARRAY ARRAY['anon','authenticated','service_role'] LOOP
                IF has_function_privilege(role_name,expected.signature,'EXECUTE') IS DISTINCT FROM
                   (role_name='service_role' AND expected.signature='public.finish_document_operation(uuid,uuid,uuid,text)') THEN
                  RAISE EXCEPTION 'Unexpected registration completion execution grant';
                END IF;
              END LOOP;
            END LOOP;
            IF NOT has_function_privilege(admission_owner,'public.lock_internal_document_capacity_completion()','EXECUTE')
              OR NOT has_function_privilege(admission_owner,'public.record_internal_document_registration_completion(uuid)','EXECUTE') THEN
              RAISE EXCEPTION 'Existing admission owner requires only its private completion helper calls';
            END IF;
            FOREACH relation_name IN ARRAY ARRAY['public.document_registration_completion_receipts','public.document_capacity_registration_settlements'] LOOP
              IF NOT EXISTS(SELECT 1 FROM pg_class WHERE oid=to_regclass(relation_name) AND relrowsecurity AND relowner=current_user::regrole) THEN
                RAISE EXCEPTION 'Private registration receipt ownership and row security required';
              END IF;
              FOREACH role_name IN ARRAY ARRAY['anon','authenticated','service_role'] LOOP
                FOREACH privilege_name IN ARRAY ARRAY['SELECT','INSERT','UPDATE','DELETE','TRUNCATE'] LOOP
                  IF has_table_privilege(role_name,relation_name,privilege_name) THEN RAISE EXCEPTION 'Unexpected registration receipt table grant'; END IF;
                END LOOP;
                FOREACH privilege_name IN ARRAY ARRAY['SELECT','INSERT','UPDATE'] LOOP
                  IF has_any_column_privilege(role_name,relation_name,privilege_name) THEN RAISE EXCEPTION 'Unexpected registration receipt column grant'; END IF;
                END LOOP;
              END LOOP;
            END LOOP;
            FOR expected IN SELECT * FROM (VALUES
              ('public.document_registration_completion_receipts','document_registration_completion_frozen','public.guard_document_registration_completion_receipt()'),
              ('public.document_capacity_registration_settlements','document_capacity_registration_settlement_frozen','public.guard_document_capacity_registration_settlement()'),
              ('public.ai_jobs','ai_jobs_guard_registered_document_summary','public.guard_registered_document_summary_queue()')
            ) x(relation_name,trigger_name,signature) LOOP
              IF NOT EXISTS(SELECT 1 FROM pg_trigger WHERE tgrelid=to_regclass(expected.relation_name) AND tgname=expected.trigger_name
                AND tgfoid=to_regprocedure(expected.signature) AND tgenabled='O' AND NOT tgisinternal) THEN
                RAISE EXCEPTION 'Registration receipt/source guards must remain enabled';
              END IF;
            END LOOP;
            IF EXISTS(SELECT 1 FROM public.document_registration_completion_receipts) OR EXISTS(SELECT 1 FROM public.document_capacity_registration_settlements)
              OR NOT EXISTS(SELECT 1 FROM public.document_capacity_policy WHERE singleton AND global_units IS NULL AND actor_units IS NULL AND student_units IS NULL) THEN
              RAISE EXCEPTION 'Registration capacity must remain dormant and empty';
            END IF;
          END; $registration$;
          SQL
          # Disposable service completion crosses the original admission owner
          # and the private recorder owner. Rollback leaves no leases or receipts.
          PGUSER=supabase_admin psql -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          SET LOCAL ROLE service_role;
          DO $owner_bridge_smoke$
          DECLARE receipt jsonb;
          BEGIN
            PERFORM public.set_document_operation_pause('00000000-0000-4000-8000-000000000007',1,false,'resume');
            receipt:=public.begin_document_operation('00000000-0000-4000-8000-000000000902','00000000-0000-4000-8000-000000000001','register');
            PERFORM public.finish_document_operation((receipt->>'operation_id')::uuid,'00000000-0000-4000-8000-000000000001',(receipt->>'receipt_id')::uuid,'completed');
            IF NOT (public.inspect_document_operation_drain()->>'tracked_operations_clear')::boolean THEN RAISE EXCEPTION 'Disposable completion remained active'; END IF;
          END; $owner_bridge_smoke$;
          ROLLBACK;
          SQL
          psql -v ON_ERROR_STOP=1 -At <<'SQL' > /tmp/document-registration-capacity-settlement.json
          SELECT jsonb_build_object('schema','document-registration-capacity-settlement-proof-v1','phase','after-ninth-proposal',
            'paused',(SELECT paused FROM public.document_operation_control WHERE singleton),
            'admission_owner',(SELECT relowner::regrole::text FROM pg_class WHERE oid='public.document_operation_control'::regclass),
            'registration_receipts',(SELECT count(*) FROM public.document_registration_completion_receipts),
            'registration_settlements',(SELECT count(*) FROM public.document_capacity_registration_settlements),
            'policy_unset',(SELECT global_units IS NULL AND actor_units IS NULL AND student_units IS NULL FROM public.document_capacity_policy WHERE singleton),
            'restricted_executor_restored',true,'service_owner_bridge_rollback_passed',true,
            'registration_receipt_prepared',true,'clean_registration_units',1,'no_summary_quarantine_units',2,
            'rescan_apply_settlement_implemented',false,'producer_worker_capacity_hooks_installed',false,'general_application_limits_implemented',false,
            'queue_budget_reservation_implemented',false,'manual_reconciliation_implemented',false,'provider_quiescence_verified',false,'ready_for_cutover',false,
            'routines',(SELECT jsonb_agg(jsonb_build_object('name',proname,'body_md5',md5(prosrc),'definer',prosecdef,'fixed_path',proconfig,'owner',proowner::regrole::text) ORDER BY proname)
              FROM pg_proc WHERE oid IN ('public.read_internal_document_registration_completion(uuid)'::regprocedure,
                'public.guard_document_registration_completion_receipt()'::regprocedure,'public.record_internal_document_registration_completion(uuid)'::regprocedure,
                'public.guard_registered_document_summary_queue()'::regprocedure,'public.guard_document_capacity_registration_settlement()'::regprocedure,
                'public.settle_internal_document_registration_capacity(uuid)'::regprocedure,'public.finish_document_operation(uuid,uuid,uuid,text)'::regprocedure,
                'public.guard_document_capacity_reservation()'::regprocedure)));
          SQL

      - name: Verify private rescan source claim and dormant capacity boundary
        run: |
          psql -v ON_ERROR_STOP=1 -f docs/production-readiness/proposals/document-rescan-source-claim.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $rescan_proof$
          DECLARE expected record;role_name text;
          BEGIN
            FOR expected IN SELECT * FROM (VALUES
              ('public.guard_document_rescan_source_binding()','9cde41dda57eaaac0ac7aacb666e27a2',false),
              ('public.begin_internal_document_rescan(uuid,uuid,uuid,timestamptz,jsonb)','5813809f271e1b2b94af7ffa0b11ffd4',false),
              ('public.guard_unfinished_document_rescan()','5df6d295d63bfe0a3441e1050fef1212',true)
            ) x(signature,body_md5,definer) LOOP
              IF NOT EXISTS(SELECT 1 FROM pg_proc WHERE oid=to_regprocedure(expected.signature) AND md5(prosrc)=expected.body_md5
                AND prosecdef=expected.definer AND proowner=current_user::regrole::oid AND proconfig=ARRAY['search_path=pg_catalog']) THEN
                RAISE EXCEPTION 'Unexpected private rescan definition or owner'; END IF;
              FOREACH role_name IN ARRAY ARRAY['anon','authenticated','service_role'] LOOP
                IF has_function_privilege(role_name,expected.signature,'EXECUTE') THEN RAISE EXCEPTION 'Unexpected private rescan execution'; END IF;
              END LOOP;
            END LOOP;
            IF NOT EXISTS(SELECT 1 FROM pg_class WHERE oid='public.document_rescan_source_bindings'::regclass AND relrowsecurity AND relowner=current_user::regrole::oid) THEN
              RAISE EXCEPTION 'Private rescan row security/ownership required'; END IF;
            FOREACH role_name IN ARRAY ARRAY['anon','authenticated','service_role'] LOOP
              IF has_table_privilege(role_name,'public.document_rescan_source_bindings','SELECT,INSERT,UPDATE,DELETE,TRUNCATE')
                OR has_any_column_privilege(role_name,'public.document_rescan_source_bindings','SELECT,INSERT,UPDATE') THEN RAISE EXCEPTION 'Unexpected private rescan data privilege'; END IF;
            END LOOP;
            IF NOT EXISTS(SELECT 1 FROM pg_trigger WHERE tgrelid='public.document_rescan_source_bindings'::regclass AND tgname='document_rescan_source_frozen'
              AND tgfoid='public.guard_document_rescan_source_binding()'::regprocedure AND tgtype=31 AND tgenabled='O' AND NOT tgisinternal)
              OR NOT EXISTS(SELECT 1 FROM pg_trigger WHERE tgrelid='public.document_operation_leases'::regclass AND tgname='document_rescan_no_false_finish'
              AND tgfoid='public.guard_unfinished_document_rescan()'::regprocedure AND tgtype=19 AND tgenabled='O' AND NOT tgisinternal) THEN
              RAISE EXCEPTION 'Rescan source and unfinished-work guards must stay enabled'; END IF;
            IF EXISTS(SELECT 1 FROM public.document_rescan_source_bindings) OR EXISTS(SELECT 1 FROM public.document_capacity_reservations)
              OR NOT EXISTS(SELECT 1 FROM public.document_operation_control WHERE singleton AND paused)
              OR NOT EXISTS(SELECT 1 FROM public.document_capacity_policy WHERE singleton AND global_units IS NULL AND actor_units IS NULL AND student_units IS NULL) THEN
              RAISE EXCEPTION 'Rescan foundation must remain paused, empty and unset'; END IF;
          END; $rescan_proof$;
          SQL
          psql -v ON_ERROR_STOP=1 -At <<'SQL' > /tmp/document-rescan-source-claim.json
          SELECT jsonb_build_object('schema','document-rescan-source-claim-proof-v1','phase','after-tenth-proposal',
            'paused',(SELECT paused FROM public.document_operation_control WHERE singleton),
            'source_bindings',(SELECT count(*) FROM public.document_rescan_source_bindings),
            'policy_unset',(SELECT global_units IS NULL AND actor_units IS NULL AND student_units IS NULL FROM public.document_capacity_policy WHERE singleton),
            'private_source_capacity_claim_prepared',true,'reserved_units',2,'ordinary_execution_grants',false,
            'pending_transition_implemented',false,'rescan_completion_settlement_implemented',false,'endpoint_source_claim_wired',false,
            'general_application_limits_implemented',false,'manual_reconciliation_implemented',false,'provider_quiescence_verified',false,'ready_for_cutover',false,
            'routines',(SELECT jsonb_agg(jsonb_build_object('name',proname,'body_md5',md5(prosrc),'definer',prosecdef,'fixed_path',proconfig,'owner',proowner::regrole::text) ORDER BY proname)
              FROM pg_proc WHERE oid IN ('public.guard_document_rescan_source_binding()'::regprocedure,'public.begin_internal_document_rescan(uuid,uuid,uuid,timestamptz,jsonb)'::regprocedure,'public.guard_unfinished_document_rescan()'::regprocedure)));
          SQL

      - name: Inventory document reference metadata without reading user rows
        run: |
          PGUSER=supabase_admin psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $reader$
          DECLARE reader_oid oid;
          BEGIN
            IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='tf_document_catalog_reader') THEN
              CREATE ROLE tf_document_catalog_reader NOLOGIN NOINHERIT;
            END IF;
            SELECT oid INTO reader_oid FROM pg_roles WHERE rolname='tf_document_catalog_reader'
              AND NOT rolcanlogin AND NOT rolinherit AND NOT rolsuper AND NOT rolbypassrls
              AND NOT rolcreaterole AND NOT rolcreatedb AND NOT rolreplication;
            IF reader_oid IS NULL OR EXISTS(SELECT 1 FROM pg_auth_members WHERE member=reader_oid) THEN
              RAISE EXCEPTION 'Catalog reader role is not isolated';
            END IF;
          END;
          $reader$;
          GRANT USAGE ON SCHEMA public,storage TO tf_document_catalog_reader;
          SQL
          PGOPTIONS='-c default_transaction_read_only=on' PGUSER=supabase_admin psql -qAt -v ON_ERROR_STOP=1 \
            -c 'SET ROLE tf_document_catalog_reader' \
            -f docs/production-readiness/proposals/document-reference-catalog.sql > /tmp/document-reference-catalog.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const x=JSON.parse(readFileSync('/tmp/document-reference-catalog.json','utf8'));
          assert.equal(x.schema,'document-reference-catalog-v1');
          assert.equal(x.reader_role,'tf_document_catalog_reader');assert.equal(x.read_only_transaction,true);
          assert.equal(x.reader_can_select_protected_relations,false);assert.equal(x.reader_can_select_job_rows,false);
          assert.equal(x.catalog_metadata_only,true);
          assert.equal(x.data_rows_inspected,false);
          assert.equal(x.reference_inventory_complete,false);
          assert.equal(x.cleanup_authorized,false);
          assert.equal(x.targets.length,4);assert.ok(x.targets.every(t=>t.present));
          assert.ok(x.foreign_keys.some(k=>k.source_table==='public.document_upload_resolution_claims'&&k.target_table==='public.document_upload_attempts'&&k.delete_action==='restrict'));
          assert.ok(x.untyped_json_candidates.some(c=>c.table_name==='public.ai_jobs'&&c.column_name==='input_source'));
          assert.ok(x.foreign_keys.some(k=>k.source_table==='public.document_summary_source_bindings'&&k.target_table==='public.ai_jobs'&&k.delete_action==='restrict'));
          const sourceGrants=x.effective_table_grants.filter(g=>g.table_name==='public.document_summary_source_bindings');
          assert.equal(sourceGrants.length,3);assert.ok(sourceGrants.every(g=>!g.can_select&&!g.can_insert&&!g.can_update&&!g.can_delete&&!g.can_truncate));
          assert.ok(x.triggers.some(t=>t.name==='upload_attempt_resolution_frozen'&&t.enabled==='O'));
          console.log(JSON.stringify({foreign_keys:x.foreign_keys.length,named_candidates:x.named_reference_candidates.length,json_candidates:x.untyped_json_candidates.length,routine_candidates:x.routine_candidates.length}));
          NODE

