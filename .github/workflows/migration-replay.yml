jobs:
  native-document-boundary-partition:
    name: Native document boundaries (${{ matrix.partition }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        partition: ["summary-automatic-settlement", "counted-worker", "other-boundaries", "producer-and-summary-boundaries", "rescan-source-and-pending", "rescan-outcome", "rescan-settlement"]
    services:
      postgres:
        image: supabase/postgres:15.8.1.020
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run native partition in a fresh disposable database
        env:
          PGUSER: supabase_admin
          DOCUMENT_NATIVE_PARTITION: ${{ matrix.partition }}
        run: |
          npm install --prefix "$RUNNER_TEMP/pathway-history-tests" --ignore-scripts --no-save --package-lock=false pg@8.16.3
          set -o pipefail
          PATHWAY_HISTORY_POSTGRES=1 \
          PATHWAY_HISTORY_PG_MODULE="$RUNNER_TEMP/pathway-history-tests/node_modules/pg/lib/index.js" \
            node tests/database/run-document-path-native-partition.mjs
      - name: Retain complete native document results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-document-boundaries-${{ matrix.partition }}
          path: |
            /tmp/native-document-boundaries-${{ matrix.partition }}.log
            /tmp/native-document-boundaries-${{ matrix.partition }}.json
          if-no-files-found: warn


  native-document-boundaries:
    name: Complete native document boundaries
    if: always()
    needs: native-document-boundary-partition
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          pattern: native-document-boundaries-*
          path: /tmp/native-document-results
      - name: Verify native result gate rejection cases
        run: node --test tests/document-case-batches.test.mjs tests/document-native-result-validation.test.mjs
      - name: Require every source-matched native case with zero skips
        run: node tests/database/verify-document-native-results.mjs /tmp/native-document-results
      - name: Require all native partition jobs to succeed
        env:
          PARTITION_STATUS: ${{ needs.native-document-boundary-partition.result }}
        run: test "$PARTITION_STATUS" = success
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-document-boundaries-log
          path: /tmp/document-native-complete.json
          if-no-files-found: error

  replay:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:15.8.1.020
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Deno for credential-free worker type checking
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check verified document worker without credentials
        run: deno check --no-config --no-lock --node-modules-dir=none supabase/functions/ai-job-processor/index.ts

      - name: Exercise document-summary worker with intercepted IO only
        run: deno test --no-config --no-lock --node-modules-dir=none --allow-env=SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,LOVABLE_API_KEY tests/edge/ai-job-processor.test.ts

      - name: Test membership removal and frozen chat history without credentials
        run: |
          npm install --prefix "$RUNNER_TEMP/channel-history-tests" --ignore-scripts --no-save --package-lock=false @electric-sql/pglite@0.5.8
          CHANNEL_HISTORY_PGLITE_MODULE="$RUNNER_TEMP/channel-history-tests/node_modules/@electric-sql/pglite/dist/index.js" \
            node --test tests/database/channel-history-removal.test.mjs

      - name: Test proposed report-share lifecycle without hosted credentials
        run: |
          SHARE_POLICY_PGLITE_MODULE="$RUNNER_TEMP/channel-history-tests/node_modules/@electric-sql/pglite/dist/index.js" \
            node --test tests/database/report-share-lifecycle.test.mjs

      - name: Test atomic report history in a disposable multi-session database
        env:
          PGUSER: supabase_admin
        run: |
          npm install --prefix "$RUNNER_TEMP/pathway-history-tests" --ignore-scripts --no-save --package-lock=false pg@8.16.3
          PATHWAY_HISTORY_POSTGRES=1 \
          PATHWAY_HISTORY_PG_MODULE="$RUNNER_TEMP/pathway-history-tests/node_modules/pg/lib/index.js" \
            node --test tests/database/atomic-pathway-history.test.mjs

      - name: Test proposed share lifecycle in disposable concurrent sessions
        env:
          PGUSER: supabase_admin
        run: |
          SHARE_LIFECYCLE_POSTGRES=1 \
          SHARE_POLICY_PG_MODULE="$RUNNER_TEMP/pathway-history-tests/node_modules/pg/lib/index.js" \
            node --test tests/database/report-share-lifecycle.test.mjs

      - name: Test canonical linked-student save in disposable concurrent sessions
        env:
          PGUSER: supabase_admin
        run: |
          PATHWAY_HISTORY_POSTGRES=1 \
          PATHWAY_HISTORY_PG_MODULE="$RUNNER_TEMP/pathway-history-tests/node_modules/pg/lib/index.js" \
            node --test tests/database/report-linked-student-save.test.mjs

