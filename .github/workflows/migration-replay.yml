name: Migration Replay (disposable Postgres)

# Replays every canonical migration in supabase/migrations against a fresh,
# disposable Postgres instance. Runs as the superuser of a throwaway database,
# which removes the local root-user limitation that forced three
# realtime.messages policy statements to be skipped during the staging replay.

on:
  push:
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/migration-replay.yml"
      - "tests/documents-rls.test.mjs"
      - "tests/__snapshots__/documents-rls-policies.snap.json"
  pull_request:
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/migration-replay.yml"
      - "tests/documents-rls.test.mjs"
      - "tests/__snapshots__/documents-rls-policies.snap.json"
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:15.8.1.020
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bootstrap Supabase-like roles and schemas
        run: |
          PGUSER=supabase_admin psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$ begin
            if not exists (select 1 from pg_roles where rolname='anon') then create role anon nologin noinherit; end if;
            if not exists (select 1 from pg_roles where rolname='authenticated') then create role authenticated nologin noinherit; end if;
            if not exists (select 1 from pg_roles where rolname='service_role') then create role service_role nologin noinherit bypassrls; end if;
            if not exists (select 1 from pg_roles where rolname='authenticator') then create role authenticator login noinherit; end if;
            if not exists (select 1 from pg_roles where rolname='supabase_admin') then create role supabase_admin login superuser; end if;
            if not exists (select 1 from pg_roles where rolname='supabase_auth_admin') then create role supabase_auth_admin login noinherit createrole; end if;
          end $$;
          create schema if not exists auth authorization supabase_auth_admin;
          create schema if not exists storage;
          create schema if not exists realtime;
          create schema if not exists extensions;
          -- The database image supplies Storage-managed tables, but not the
          -- complete Storage API schema that hosted projects receive. Add only
          -- the managed column our migrations consume and delegate policy DDL
          -- to the same restricted postgres role used for migration replay.
          alter table storage.buckets
            add column if not exists public boolean not null default false;
          alter table storage.buckets owner to postgres;
          alter table storage.objects owner to postgres;
          grant usage, create on schema storage to postgres;
          create extension if not exists "uuid-ossp" with schema extensions;
          create extension if not exists pgcrypto with schema extensions;
          create extension if not exists pg_trgm;
          -- minimal auth surface the app migrations reference
          create table if not exists auth.users (
            id uuid primary key default gen_random_uuid(),
            email text,
            raw_user_meta_data jsonb default '{}'::jsonb,
            created_at timestamptz default now()
          );
          create or replace function auth.uid() returns uuid language sql stable
            as $$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          create or replace function auth.role() returns text language sql stable
            as $$ select coalesce(nullif(current_setting('request.jwt.claim.role', true), ''), current_user) $$;
          create or replace function auth.jwt() returns jsonb language sql stable
            as $$ select coalesce(nullif(current_setting('request.jwt.claims', true), '')::jsonb, '{}'::jsonb) $$;
          -- Bootstrap through the image's real administrative connection. The
          -- postgres role remains non-superuser, matching hosted Supabase.
          create table if not exists realtime.messages (
            id bigserial primary key,
            topic text,
            extension text,
            payload jsonb,
            inserted_at timestamptz default now()
          );
          create or replace function realtime.topic() returns text
            language sql stable
            as $$ select nullif(current_setting('realtime.topic', true), '') $$;
          alter table realtime.messages enable row level security;
          alter table realtime.messages owner to postgres;
          alter function realtime.topic() owner to postgres;
          grant usage, create on schema realtime to postgres;
          SQL

      - name: Replay all canonical migrations in order
        run: |
          set -euo pipefail
          count=0
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "::group::$f"
            psql -v ON_ERROR_STOP=1 -f "$f"
            echo "::endgroup::"
            count=$((count+1))
          done
          echo "replayed $count migrations"
          test "$count" -ge 175

      - name: Assert realtime.messages policies applied (no silent drift)
        run: |
          psql -v ON_ERROR_STOP=1 -tAc \
            "select count(*) from pg_policies where schemaname='realtime' and tablename='messages';" \
            | tee /tmp/realtime_policies.txt
          test "$(cat /tmp/realtime_policies.txt)" -ge 1

      - name: Canonical document RLS snapshot matches migration replay
        env:
          DOCUMENT_RLS_POLICY_ONLY: "1"
        run: node --test tests/documents-rls.test.mjs

      - name: Privileged HTTP cron is fail-closed after replay
        run: |
          psql -v ON_ERROR_STOP=1 -tAc "
            select count(*) = 0
            from cron.job
            where jobname in (
              'transition-channel-digest-tick',
              'obs-alert-check',
              'obs-events-purge'
            );" | grep -qx t

          psql -v ON_ERROR_STOP=1 -tAc "
            select not has_function_privilege(
              'anon',
              'transitionforward_private.schedule_privileged_http_jobs()',
              'EXECUTE'
            )
            and not has_function_privilege(
              'authenticated',
              'transitionforward_private.schedule_privileged_http_jobs()',
              'EXECUTE'
            )
            and not has_function_privilege(
              'service_role',
              'transitionforward_private.schedule_privileged_http_jobs()',
              'EXECUTE'
            );" | grep -qx t

      - name: Grant hygiene — anon must not reach licensing or billing tables
        run: |
          psql -v ON_ERROR_STOP=1 -tAc "
            select bool_and(
              not has_table_privilege('anon', t, 'SELECT')
              and not has_table_privilege('anon', t, 'INSERT')
              and not has_table_privilege('anon', t, 'UPDATE')
              and not has_table_privilege('anon', t, 'DELETE')
              and not has_table_privilege('anon', t, 'TRUNCATE')
              and not has_table_privilege('anon', t, 'REFERENCES')
              and not has_table_privilege('anon', t, 'TRIGGER')
            )
            from unnest(array[
              'public.license_allocations',
              'public.entitlement_audit_events',
              'public.billing_accounts',
              'public.subscriptions',
              'public.processed_payment_events'
            ]) t;" | grep -qx t

      - name: Webhook conflict targets are PostgREST-inferable
        run: |
          psql -v ON_ERROR_STOP=1 -tAc "
            select count(*) = 3
            from pg_index i
            join pg_class c on c.oid = i.indexrelid
            join pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'public'
              and c.relname in (
                'billing_accounts_subject_environment_uidx',
                'access_entitlements_subject_plan_uidx',
                'license_pools_subscription_type_uidx'
              )
              and i.indisunique
              and i.indpred is null;" | grep -qx t

          psql -v ON_ERROR_STOP=1 -tAc "
            select count(*) = 2
            from pg_index i
            join pg_class c on c.oid = i.indexrelid
            join pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'public'
              and c.relname in (
                'billing_accounts_subject_environment_uidx',
                'access_entitlements_subject_plan_uidx'
              )
              and i.indnullsnotdistinct;" | grep -qx t

      - name: Upload replay log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-replay-log
          path: /tmp/realtime_policies.txt
          if-no-files-found: ignore
