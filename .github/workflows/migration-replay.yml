            OR NOT EXISTS(SELECT 1 FROM pg_trigger WHERE tgrelid='public.document_operation_leases'::regclass AND tgname='document_settled_summary_lease_frozen'
             AND tgfoid='public.guard_settled_document_summary_lease()'::regprocedure AND tgtype=27 AND tgenabled='O' AND NOT tgisinternal)
            OR NOT EXISTS(SELECT 1 FROM pg_trigger WHERE tgrelid='public.document_capacity_summary_settlements'::regclass AND tgname='document_capacity_summary_settlement_frozen'
             AND tgfoid='public.guard_document_capacity_summary_settlement()'::regprocedure AND tgtype=31 AND tgenabled='O' AND NOT tgisinternal) THEN
            RAISE EXCEPTION 'Exact private settlement and lease guards required'; END IF;
           IF NOT EXISTS(SELECT 1 FROM public.document_operation_control WHERE singleton AND paused)
            OR NOT EXISTS(SELECT 1 FROM public.document_capacity_policy WHERE singleton AND global_units IS NULL AND actor_units IS NULL AND student_units IS NULL)
            OR EXISTS(SELECT 1 FROM public.document_capacity_reservations) OR EXISTS(SELECT 1 FROM public.document_capacity_summary_settlements)
