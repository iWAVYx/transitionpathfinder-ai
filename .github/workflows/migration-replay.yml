jobs:
  replay:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:15.8.1.020
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Deno for credential-free worker type checking
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check verified document worker without credentials
        run: deno check --no-config --no-lock --node-modules-dir=none supabase/functions/ai-job-processor/index.ts

      - name: Exercise document-summary worker with intercepted IO only
        run: deno test --no-config --no-lock --node-modules-dir=none --allow-env=SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,LOVABLE_API_KEY tests/edge/ai-job-processor.test.ts

      - name: Test membership removal and frozen chat history without credentials
        run: |
          npm install --prefix "$RUNNER_TEMP/channel-history-tests" --ignore-scripts --no-save --package-lock=false @electric-sql/pglite@0.5.8
          CHANNEL_HISTORY_PGLITE_MODULE="$RUNNER_TEMP/channel-history-tests/node_modules/@electric-sql/pglite/dist/index.js" \
            node --test tests/database/channel-history-removal.test.mjs

      - name: Test proposed report-share lifecycle without hosted credentials
        run: |
          SHARE_POLICY_PGLITE_MODULE="$RUNNER_TEMP/channel-history-tests/node_modules/@electric-sql/pglite/dist/index.js" \
            node --test tests/database/report-share-lifecycle.test.mjs

      - name: Test atomic report history in a disposable multi-session database
        env:
          PGUSER: supabase_admin
        run: |
          npm install --prefix "$RUNNER_TEMP/pathway-history-tests" --ignore-scripts --no-save --package-lock=false pg@8.16.3
          PATHWAY_HISTORY_POSTGRES=1 \
          PATHWAY_HISTORY_PG_MODULE="$RUNNER_TEMP/pathway-history-tests/node_modules/pg/lib/index.js" \
            node --test tests/database/atomic-pathway-history.test.mjs

      - name: Test proposed share lifecycle in disposable concurrent sessions
        env:
          PGUSER: supabase_admin
        run: |
          SHARE_LIFECYCLE_POSTGRES=1 \
          SHARE_POLICY_PG_MODULE="$RUNNER_TEMP/pathway-history-tests/node_modules/pg/lib/index.js" \
            node --test tests/database/report-share-lifecycle.test.mjs

      - name: Test canonical linked-student save in disposable concurrent sessions
        env:
          PGUSER: supabase_admin
        run: |
          PATHWAY_HISTORY_POSTGRES=1 \
          PATHWAY_HISTORY_PG_MODULE="$RUNNER_TEMP/pathway-history-tests/node_modules/pg/lib/index.js" \
            node --test tests/database/report-linked-student-save.test.mjs

      - name: Test evidence saves without hosted credentials
        run: |
          PATHWAY_HISTORY_PGLITE_MODULE="$RUNNER_TEMP/channel-history-tests/node_modules/@electric-sql/pglite/dist/index.js" \
            node --test tests/database/report-evidence-save.test.mjs

      - name: Test evidence saves in disposable concurrent PostgreSQL sessions
        env:
          PGUSER: supabase_admin
        run: |
          PATHWAY_HISTORY_POSTGRES=1 \
          PATHWAY_HISTORY_PG_MODULE="$RUNNER_TEMP/pathway-history-tests/node_modules/pg/lib/index.js" \
            node --test tests/database/report-evidence-save.test.mjs

      - name: Verify registration compatibility and private rescan boundaries before full database suites
        env:
          PGUSER: supabase_admin
        run: |
          PATHWAY_HISTORY_POSTGRES=1 \
          PATHWAY_HISTORY_PG_MODULE="$RUNNER_TEMP/pathway-history-tests/node_modules/pg/lib/index.js" \
            node --test --test-name-pattern='registration read-policy|registration owner-context|rescan private' tests/database/document-path-exclusivity.test.mjs

      - name: Test proposed document upload boundaries without hosted credentials
        run: |
          PATHWAY_HISTORY_PGLITE_MODULE="$RUNNER_TEMP/channel-history-tests/node_modules/@electric-sql/pglite/dist/index.js" \
            node --test tests/database/document-path-exclusivity.test.mjs

      - name: Test proposed document upload boundaries in concurrent disposable sessions
        env:
          PGUSER: supabase_admin
        run: |
          PATHWAY_HISTORY_POSTGRES=1 \
          PATHWAY_HISTORY_PG_MODULE="$RUNNER_TEMP/pathway-history-tests/node_modules/pg/lib/index.js" \
            node --test tests/database/document-path-exclusivity.test.mjs

      - name: Test report-share restrictions in a disposable PostgreSQL database
        env:
          PGUSER: supabase_admin
        run: |
          SHARE_POLICY_POSTGRES=1 \
          SHARE_POLICY_PG_MODULE="$RUNNER_TEMP/pathway-history-tests/node_modules/pg/lib/index.js" \
            node --test tests/database/share-token-write-restriction.test.mjs

      - name: Bootstrap Supabase-like roles and schemas
        run: |
          PGUSER=supabase_admin psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$ begin
            if not exists (select 1 from pg_roles where rolname='anon') then create role anon nologin noinherit; end if;
            if not exists (select 1 from pg_roles where rolname='authenticated') then create role authenticated nologin noinherit; end if;
            if not exists (select 1 from pg_roles where rolname='service_role') then create role service_role nologin noinherit bypassrls; end if;
            if not exists (select 1 from pg_roles where rolname='authenticator') then create role authenticator login noinherit; end if;
            if not exists (select 1 from pg_roles where rolname='supabase_admin') then create role supabase_admin login superuser; end if;
            if not exists (select 1 from pg_roles where rolname='supabase_auth_admin') then create role supabase_auth_admin login noinherit createrole; end if;
          end $$;
          create schema if not exists auth authorization supabase_auth_admin;
          create schema if not exists storage;
          create schema if not exists realtime;
          create schema if not exists extensions;
          -- The database image supplies Storage-managed tables, but not the
          -- complete Storage API schema that hosted projects receive. Add only
          -- the managed column our migrations consume and delegate policy DDL
          -- to the same restricted postgres role used for migration replay.
          alter table storage.buckets
            add column if not exists public boolean not null default false;
          alter table storage.buckets owner to postgres;
          alter table storage.objects owner to postgres;
          grant usage, create on schema storage to postgres;
          create extension if not exists "uuid-ossp" with schema extensions;
          create extension if not exists pgcrypto with schema extensions;
          create extension if not exists pg_trgm;
          -- minimal auth surface the app migrations reference
          create table if not exists auth.users (
            id uuid primary key default gen_random_uuid(),
            email text,
            raw_user_meta_data jsonb default '{}'::jsonb,
            created_at timestamptz default now()
          );
          create or replace function auth.uid() returns uuid language sql stable
            as $$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          create or replace function auth.role() returns text language sql stable
            as $$ select coalesce(nullif(current_setting('request.jwt.claim.role', true), ''), current_user) $$;
          create or replace function auth.jwt() returns jsonb language sql stable
            as $$ select coalesce(nullif(current_setting('request.jwt.claims', true), '')::jsonb, '{}'::jsonb) $$;
          -- Bootstrap through the image's real administrative connection. The
          -- postgres role remains non-superuser, matching hosted Supabase.
          create table if not exists realtime.messages (
            id bigserial primary key,
            topic text,
            extension text,
            payload jsonb,
            inserted_at timestamptz default now()
          );
          create or replace function realtime.topic() returns text
            language sql stable
            as $$ select nullif(current_setting('realtime.topic', true), '') $$;
          alter table realtime.messages enable row level security;
          alter table realtime.messages owner to postgres;
          alter function realtime.topic() owner to postgres;
          grant usage, create on schema realtime to postgres;
          SQL

      - name: Replay all canonical migrations in order
        run: |
          set -euo pipefail
          count=0
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "::group::$f"
            if [[ "$f" == *20261024030000_enforce_report_share_lifecycle.sql ]]; then
              node tests/database/report-share-lifecycle-replay.mjs > "$RUNNER_TEMP/report-share-lifecycle-replay.sql"
              psql -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/report-share-lifecycle-replay.sql"
            fi
            psql -v ON_ERROR_STOP=1 -f "$f"
            echo "::endgroup::"
            count=$((count+1))
          done
          echo "replayed $count migrations"
          test "$count" -eq 225

      - name: Verify combined canonical history and privileged routine permissions
        run: |
          REPORT_HISTORY_CANONICAL_REPLAY=1 \
          PATHWAY_HISTORY_PG_MODULE="$RUNNER_TEMP/pathway-history-tests/node_modules/pg/lib/index.js" \
            node tests/database/report-history-canonical-grants.mjs

      - name: Assert realtime.messages policies applied (no silent drift)
        run: |
          psql -v ON_ERROR_STOP=1 -tAc \
            "select count(*) from pg_policies where schemaname='realtime' and tablename='messages';" \
            | tee /tmp/realtime_policies.txt
          test "$(cat /tmp/realtime_policies.txt)" -ge 1

      - name: Canonical document RLS snapshot matches migration replay
        env:
          DOCUMENT_RLS_POLICY_ONLY: "1"
        run: node --test tests/documents-rls.test.mjs

      - name: Credential-free security-finding contracts
        run: >-
          node --test
          tests/security-finding-alignment.test.mjs
          tests/security-definer-routine-grants.test.mjs
          tests/channel-attachment-malware-gate.test.mjs
          tests/channel-start-boundary.test.mjs

      - name: Student channel-start RPC remains narrowly executable
        run: |
          psql -v ON_ERROR_STOP=1 -tAc "
            select has_function_privilege('authenticated',
              'public.start_student_channel(uuid, uuid, text, text)', 'EXECUTE')
              and not has_function_privilege('anon',
                'public.start_student_channel(uuid, uuid, text, text)', 'EXECUTE')
              and has_function_privilege('authenticated',
                'public.list_student_channel_students()', 'EXECUTE')
              and not has_function_privilege('anon',
                'public.list_student_channel_students()', 'EXECUTE')
              and has_function_privilege('authenticated',
                'public.list_student_channel_recipients(uuid)', 'EXECUTE')
              and not has_function_privilege('anon',
                'public.list_student_channel_recipients(uuid)', 'EXECUTE')
              and not has_function_privilege('authenticated',
                'public.is_linked_student_channel_participant(uuid, uuid)', 'EXECUTE');
          " | grep -qx t

      - name: Privileged HTTP cron is fail-closed after replay
        run: |
          psql -v ON_ERROR_STOP=1 -tAc "
            select count(*) = 0
            from cron.job
            where jobname in (
              'transition-channel-digest-tick',
              'obs-alert-check',
              'obs-events-purge'
            );" | grep -qx t

          psql -v ON_ERROR_STOP=1 -tAc "
            select not has_function_privilege(
              'anon',
              'transitionforward_private.schedule_privileged_http_jobs()',
              'EXECUTE'
            )
            and not has_function_privilege(
              'authenticated',
              'transitionforward_private.schedule_privileged_http_jobs()',
              'EXECUTE'
            )
            and not has_function_privilege(
              'service_role',
              'transitionforward_private.schedule_privileged_http_jobs()',
              'EXECUTE'
            );" | grep -qx t

      - name: Grant hygiene — anon must not reach licensing or billing tables
        run: |
          psql -v ON_ERROR_STOP=1 -tAc "
            select bool_and(
              not has_table_privilege('anon', t, 'SELECT')
              and not has_table_privilege('anon', t, 'INSERT')
              and not has_table_privilege('anon', t, 'UPDATE')
              and not has_table_privilege('anon', t, 'DELETE')
              and not has_table_privilege('anon', t, 'TRUNCATE')
              and not has_table_privilege('anon', t, 'REFERENCES')
              and not has_table_privilege('anon', t, 'TRIGGER')
            )
            from unnest(array[
              'public.license_allocations',
              'public.entitlement_audit_events',
              'public.billing_accounts',
              'public.subscriptions',
              'public.processed_payment_events'
            ]) t;" | grep -qx t

      - name: Webhook conflict targets are PostgREST-inferable
        run: |
          psql -v ON_ERROR_STOP=1 -tAc "
            select count(*) = 3
            from pg_index i
            join pg_class c on c.oid = i.indexrelid
            join pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'public'
              and c.relname in (
                'billing_accounts_subject_environment_uidx',
                'access_entitlements_subject_plan_uidx',
                'license_pools_subscription_type_uidx'
              )
              and i.indisunique
              and i.indpred is null;" | grep -qx t

          psql -v ON_ERROR_STOP=1 -tAc "
            select count(*) = 2
            from pg_index i
            join pg_class c on c.oid = i.indexrelid
            join pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'public'
              and c.relname in (
                'billing_accounts_subject_environment_uidx',
                'access_entitlements_subject_plan_uidx'
              )
              and i.indnullsnotdistinct;" | grep -qx t

      - name: Security remediation remains fail-closed after replay
        run: |
          psql -v ON_ERROR_STOP=1 -tAc "
            select exists (
              select 1
              from pg_policies
              where schemaname = 'public'
                and tablename = 'collaboration_notes'
                and policyname = 'View notes via student'
                and qual ilike '%private_note%'
                and qual ilike '%visibility%private%'
            )
            and not has_table_privilege(
              'authenticated',
              'public.channel_attachments',
              'UPDATE'
            )
            and not has_column_privilege(
              'authenticated',
              'public.partner_organizations',
              'contact_email',
              'SELECT'
            )
            and not has_column_privilege(
              'authenticated',
              'public.partner_organizations',
              'phone',
              'SELECT'
            )
            and not has_function_privilege(
              'anon',
              'public.accept_invitation_by_token(text)',
              'EXECUTE'
            )
            and has_function_privilege(
              'authenticated',
              'public.accept_invitation_by_token(text)',
              'EXECUTE'
            )
