name: Build & SSR Verification

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lovable Preview + Full Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js for preview auth tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-deps-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-deps-${{ runner.os }}-

      - name: Cache build output
        uses: actions/cache@v4
        with:
          path: |
            .tanstack
            node_modules/.vite
          key: build-cache-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json', 'vite.config.ts', 'tsconfig.json') }}
          restore-keys: |
            build-cache-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Reject high or critical dependency advisories
        run: bun audit --audit-level=high

      - name: Verify preview auth storage isolation
        run: node --experimental-strip-types --test tests/preview-auth-storage.test.mjs

      - name: Run constrained Lovable preview and full production builds
        id: build
        run: |
          set +e
          echo "::group::Constrained Lovable preview build"
          LOVABLE_SANDBOX=1 \
            DEV_SERVER__PROJECT_PATH="$GITHUB_WORKSPACE" \
            LOVABLE_NITRO_PRESET=lovable-fetch-bundle \
            APP_ENV=production \
            VITE_APP_ENV=production \
            bun run build 2>&1 | tee build.log
          preview_exit=${PIPESTATUS[0]}
          echo "::endgroup::"
          if [ "$preview_exit" -ne 0 ]; then
            echo "exit_code=$preview_exit" >> "$GITHUB_OUTPUT"
            exit "$preview_exit"
          fi

          echo "::group::Full production SSR build"
          bun run build:production 2>&1 | tee -a build.log
          production_exit=${PIPESTATUS[0]}
          echo "::endgroup::"
          echo "exit_code=$production_exit" >> "$GITHUB_OUTPUT"
          exit "$production_exit"

      - name: Report build result
        if: always()
        run: |
          if [ "${{ steps.build.outputs.exit_code }}" = "0" ]; then
            echo "✅ **Lovable preview and full production builds succeeded**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **Lovable preview or full production build failed**" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trigger | ${{ github.event_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Runner | \`ubuntu-latest\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate SSR errors
        if: failure() && steps.build.outputs.exit_code != '0'
        run: |
          echo "::error::Lovable preview or full production build failed — SSR or bundling error detected."
          if [ -f build.log ]; then
            echo "::group::Build error details"
            tail -n 80 build.log
            echo "::endgroup::"
          fi

      - name: Upload build artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_id }}
          path: build.log
          retention-days: 7
