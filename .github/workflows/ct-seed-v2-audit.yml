name: CT Seed v2 Audit

on:
  pull_request:
    paths:
      - "src/lib/import-audit.functions.ts"
      - "src/routes/_authenticated/owner.import-audit.tsx"
      - "tests/ct-seed-v2-audit.test.mjs"
      - ".github/workflows/ct-seed-v2-audit.yml"
  push:
    branches: [main]

jobs:
  static-audit:
    name: CT Seed v2 Static Audit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-deps-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-deps-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run credential-free CT seed v2 audit
        env:
          REQUIRE_LIVE_CT_SEED_AUDIT: "false"
        run: bun run test:ct-seed-v2

  live-staging-audit:
    name: CT Seed v2 Live Staging Audit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      REQUIRE_LIVE_CT_SEED_AUDIT: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-deps-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-deps-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify isolated staging Supabase target
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::STAGING_SUPABASE_URL is missing from the GitHub staging environment."
            exit 1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::STAGING_SUPABASE_SERVICE_ROLE_KEY is missing from the GitHub staging environment."
            exit 1
          fi

          node --input-type=module <<'NODE'
          const expectedRef = "qgrertkqbwanerqqemph";
          const url = new URL(process.env.SUPABASE_URL);
          const expectedHost = `${expectedRef}.supabase.co`;
          if (url.protocol !== "https:" || url.hostname !== expectedHost) {
            throw new Error(
              `Refusing CT seed audit: expected isolated staging Supabase host ${expectedHost}, got ${url.hostname}`,
            );
          }
          console.log(`Staging Supabase target verified: ${expectedRef}`);
          NODE

      - name: Run CT seed v2 live staging audit
        run: bun run test:ct-seed-v2
