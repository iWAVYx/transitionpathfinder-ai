name: CT Seed v2 Audit

on:
  pull_request:
    paths:
      - "src/lib/import-audit.functions.ts"
      - "src/routes/_authenticated/owner.import-audit.tsx"
      - "tests/ct-seed-v2-audit.test.mjs"
      - ".github/workflows/ct-seed-v2-audit.yml"
  push:
    branches: [main]

jobs:
  ct-seed-v2-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-deps-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-deps-${{ runner.os }}-

      - name: Verify Supabase secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=()
          if [ -z "$SUPABASE_URL" ]; then
            missing+=("SUPABASE_URL")
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            missing+=("SUPABASE_SERVICE_ROLE_KEY")
          fi

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required repository secrets: ${missing[*]}"
            echo ""
            echo "Remediation:"
            echo "  1. Go to Settings → Secrets and variables → Actions"
            echo "  2. Add the missing secret(s) above with values from your Lovable Cloud project."
            echo "     - SUPABASE_URL: your project URL (e.g. https://<ref>.supabase.co)"
            echo "     - SUPABASE_SERVICE_ROLE_KEY: the service_role key (keep it secret)"
            exit 1
          fi

      - name: Run CT seed v2 audit regression
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun run test:ct-seed-v2
