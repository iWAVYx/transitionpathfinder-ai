name: CT Seed v2 Audit

on:
  pull_request:
    paths:
      - "src/lib/import-audit.functions.ts"
      - "src/routes/_authenticated/owner.import-audit.tsx"
      - "tests/ct-seed-v2-audit.test.mjs"
      - ".github/workflows/ct-seed-v2-audit.yml"
  push:
    branches: [main]

jobs:
  ct-seed-v2-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-deps-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-deps-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run CT seed v2 audit regression
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun run test:ct-seed-v2

      - name: Report skip hint
        if: failure()
        run: |
          echo "::notice::If the test was skipped due to missing Supabase credentials, add SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY as repository secrets."
