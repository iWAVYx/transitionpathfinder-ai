name: Provision Production Worker Secrets

# Manual-only secret provisioning for the already-created, unrouted production
# placeholder Worker. This workflow changes only the Worker secret inventory.
# It never builds application code, attaches a route/domain, or changes DNS.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "provision-production-worker-secrets" to confirm'
        required: true
      approved_sha:
        description: "Exact 40-character main SHA containing the reviewed workflow"
        required: true

permissions:
  contents: read

concurrency:
  group: provision-production-worker-secrets
  cancel-in-progress: false

jobs:
  provision:
    name: Provision Unrouted Production Worker Secrets
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      WORKER_NAME: transitionforward-production
      EXPECTED_CLOUDFLARE_ACCOUNT_ID: a0f40bdc4e478ac72c5a94e7964edc74
      EXPECTED_PRODUCTION_PROJECT_REF: lrqcntqyekucamifpffs
      STAGING_PROJECT_REF: qgrertkqbwanerqqemph
      CONFIRM_INPUT: ${{ github.event.inputs.confirm }}
      APPROVED_SHA_INPUT: ${{ github.event.inputs.approved_sha }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Confirm exact production provisioning intent
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CONFIRM_INPUT" != "provision-production-worker-secrets" ]; then
            echo "Confirmation text did not match the required provisioning phrase." >&2
            exit 1
          fi
          if ! [[ "$APPROVED_SHA_INPUT" =~ ^[a-f0-9]{40}$ ]]; then
            echo "approved_sha must be an exact lowercase 40-character Git SHA." >&2
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$APPROVED_SHA_INPUT" != "$GITHUB_SHA" ]; then
            echo "Secret provisioning requires the exact approved main SHA." >&2
            exit 1
          fi
          if [ "$GITHUB_REPOSITORY" != "iWAVYx/transitionpathfinder-ai" ]; then
            echo "Unexpected repository identity." >&2
            exit 1
          fi
          if ! jq -e '
            .status == "no-go" and
            .production.hostingProvider == "cloudflare-workers" and
            .production.githubEnvironmentProvisioned == true and
            .production.deploymentWorkflowProvisioned == true
          ' docs/production-readiness/audit-state.json >/dev/null; then
            echo "The reviewed pre-release production control state is not present." >&2
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Validate protected production values without printing them
        shell: bash
        env:
          PRODUCTION_CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          PRODUCTION_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          PRODUCTION_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
          PRODUCTION_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
          PRODUCTION_PAYMENTS_CLIENT_TOKEN: ${{ secrets.PRODUCTION_PAYMENTS_CLIENT_TOKEN }}
          PRODUCTION_STRIPE_LIVE_API_KEY: ${{ secrets.PRODUCTION_STRIPE_LIVE_API_KEY }}
          PRODUCTION_PAYMENTS_LIVE_WEBHOOK_SECRET: ${{ secrets.PRODUCTION_PAYMENTS_LIVE_WEBHOOK_SECRET }}
          PRODUCTION_CRON_WEBHOOK_SECRET: ${{ secrets.PRODUCTION_CRON_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          required=(
            PRODUCTION_CLOUDFLARE_API_TOKEN
            PRODUCTION_CLOUDFLARE_ACCOUNT_ID
            PRODUCTION_SUPABASE_URL
            PRODUCTION_SUPABASE_PUBLISHABLE_KEY
            PRODUCTION_SUPABASE_SERVICE_ROLE_KEY
            PRODUCTION_PAYMENTS_CLIENT_TOKEN
            PRODUCTION_STRIPE_LIVE_API_KEY
            PRODUCTION_PAYMENTS_LIVE_WEBHOOK_SECRET
            PRODUCTION_CRON_WEBHOOK_SECRET
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Required protected production value ${name} is missing." >&2
              exit 1
            fi
          done

          expected_url="https://${EXPECTED_PRODUCTION_PROJECT_REF}.supabase.co"
          if [ "$PRODUCTION_SUPABASE_URL" != "$expected_url" ]; then
            echo "Production Supabase URL does not target the approved project." >&2
            exit 1
          fi
          if [ "$PRODUCTION_CLOUDFLARE_ACCOUNT_ID" != "$EXPECTED_CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Production Cloudflare account ID does not match the approved account." >&2
            exit 1
          fi
          case "$PRODUCTION_PAYMENTS_CLIENT_TOKEN" in
            pk_live_*) ;;
            *) echo "Production payments client token is not live-mode." >&2; exit 1 ;;
          esac
          case "$PRODUCTION_STRIPE_LIVE_API_KEY" in
            sk_live_*|rk_live_*) ;;
            *) echo "Production Stripe server key is not live-mode." >&2; exit 1 ;;
          esac
          case "$PRODUCTION_PAYMENTS_LIVE_WEBHOOK_SECRET" in
            whsec_*) ;;
            *) echo "Production payments webhook value is not a signing secret." >&2; exit 1 ;;
          esac
          if [ "${#PRODUCTION_SUPABASE_SERVICE_ROLE_KEY}" -lt 40 ] \
            || [ "$PRODUCTION_SUPABASE_SERVICE_ROLE_KEY" = "$PRODUCTION_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Production Supabase service-role value is invalid." >&2
            exit 1
          fi
          if [ "${#PRODUCTION_CRON_WEBHOOK_SECRET}" -lt 32 ] \
            || [ "$PRODUCTION_CRON_WEBHOOK_SECRET" = "$PRODUCTION_PAYMENTS_LIVE_WEBHOOK_SECRET" ]; then
            echo "Production cron webhook secret is invalid or reused." >&2
            exit 1
          fi

          protected_values=(
            "$PRODUCTION_SUPABASE_URL"
            "$PRODUCTION_SUPABASE_PUBLISHABLE_KEY"
            "$PRODUCTION_SUPABASE_SERVICE_ROLE_KEY"
            "$PRODUCTION_PAYMENTS_CLIENT_TOKEN"
            "$PRODUCTION_STRIPE_LIVE_API_KEY"
            "$PRODUCTION_PAYMENTS_LIVE_WEBHOOK_SECRET"
            "$PRODUCTION_CRON_WEBHOOK_SECRET"
          )
          for value in "${protected_values[@]}"; do
            if [[ "$value" == *"$STAGING_PROJECT_REF"* ]] \
              || [[ "$value" == pk_test_* ]] \
              || [[ "$value" == pk_sandbox_* ]] \
              || [[ "$value" == sk_test_* ]] \
              || [[ "$value" == sk_sandbox_* ]] \
              || [[ "$value" == rk_test_* ]]; then
              echo "A staging or sandbox value was supplied to production provisioning." >&2
              exit 1
            fi
          done

      - name: Require the existing Worker to remain unrouted
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bunx wrangler deployments list --json --name "$WORKER_NAME" >/dev/null

          subdomain_state=$(curl \
            --silent \
            --show-error \
            --fail \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/subdomain")
          if ! jq -e '
            .success == true and
            .result.enabled == false and
            .result.previews_enabled == false
          ' <<<"$subdomain_state" >/dev/null; then
            echo "The production Worker is publicly reachable; refusing secret provisioning." >&2
            exit 1
          fi

          current_inventory=$(bunx wrangler secret list --format json --name "$WORKER_NAME")
          approved=(
            SUPABASE_URL
            SUPABASE_PUBLISHABLE_KEY
            SUPABASE_SERVICE_ROLE_KEY
            PAYMENTS_CLIENT_TOKEN
            STRIPE_LIVE_API_KEY
            PAYMENTS_LIVE_WEBHOOK_SECRET
            CRON_WEBHOOK_SECRET
          )
          forbidden=(
            STAGING_E2E_PASSWORD
            STAGING_SUPABASE_URL
            STAGING_SUPABASE_SERVICE_ROLE_KEY
            STAGING_STRIPE_API_KEY
            STRIPE_SANDBOX_API_KEY
            PAYMENTS_SANDBOX_WEBHOOK_SECRET
          )
          for name in "${forbidden[@]}"; do
            if jq -e --arg name "$name" '.[] | select(.name == $name)' \
              <<<"$current_inventory" >/dev/null; then
              echo "A forbidden staging or sandbox secret name exists on the production Worker." >&2
              exit 1
            fi
          done

          approved_names=$(printf '%s\n' "${approved[@]}" | sort)
          if ! jq -e --arg approved "$approved_names" '
            ($approved | split("\n")) as $allowed |
            all(.[]; .name as $name | $allowed | index($name))
          ' <<<"$current_inventory" >/dev/null; then
            echo "An unapproved secret name exists on the production Worker." >&2
            exit 1
          fi

      - name: Provision the exact approved Worker secret set
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          PRODUCTION_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
          PRODUCTION_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
          PRODUCTION_PAYMENTS_CLIENT_TOKEN: ${{ secrets.PRODUCTION_PAYMENTS_CLIENT_TOKEN }}
          PRODUCTION_STRIPE_LIVE_API_KEY: ${{ secrets.PRODUCTION_STRIPE_LIVE_API_KEY }}
          PRODUCTION_PAYMENTS_LIVE_WEBHOOK_SECRET: ${{ secrets.PRODUCTION_PAYMENTS_LIVE_WEBHOOK_SECRET }}
          PRODUCTION_CRON_WEBHOOK_SECRET: ${{ secrets.PRODUCTION_CRON_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          jq -cn '
            {
              SUPABASE_URL: env.PRODUCTION_SUPABASE_URL,
              SUPABASE_PUBLISHABLE_KEY: env.PRODUCTION_SUPABASE_PUBLISHABLE_KEY,
              SUPABASE_SERVICE_ROLE_KEY: env.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY,
              PAYMENTS_CLIENT_TOKEN: env.PRODUCTION_PAYMENTS_CLIENT_TOKEN,
              STRIPE_LIVE_API_KEY: env.PRODUCTION_STRIPE_LIVE_API_KEY,
              PAYMENTS_LIVE_WEBHOOK_SECRET: env.PRODUCTION_PAYMENTS_LIVE_WEBHOOK_SECRET,
              CRON_WEBHOOK_SECRET: env.PRODUCTION_CRON_WEBHOOK_SECRET
            }
          ' | bunx wrangler secret bulk --name "$WORKER_NAME"

      - name: Verify only approved secret names exist and exposure stays disabled
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          inventory=$(bunx wrangler secret list --format json --name "$WORKER_NAME")
          required=(
            SUPABASE_URL
            SUPABASE_PUBLISHABLE_KEY
            SUPABASE_SERVICE_ROLE_KEY
            PAYMENTS_CLIENT_TOKEN
            STRIPE_LIVE_API_KEY
            PAYMENTS_LIVE_WEBHOOK_SECRET
            CRON_WEBHOOK_SECRET
          )
          expected_names=$(printf '%s\n' "${required[@]}" | sort)
          actual_names=$(jq -r '.[].name' <<<"$inventory" | sort)
          if [ "$actual_names" != "$expected_names" ]; then
            echo "Worker secret-name inventory is not the exact approved production set." >&2
            exit 1
          fi

          subdomain_state=$(curl \
            --silent \
            --show-error \
            --fail \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/subdomain")
          if ! jq -e '
            .success == true and
            .result.enabled == false and
            .result.previews_enabled == false
          ' <<<"$subdomain_state" >/dev/null; then
            echo "Worker exposure changed during secret provisioning." >&2
            exit 1
          fi

          echo "Seven approved production Worker secret names are present; values were not read back or printed." >> "$GITHUB_STEP_SUMMARY"
          echo "The Worker remains unrouted with workers.dev and preview URLs disabled." >> "$GITHUB_STEP_SUMMARY"
