name: Release readiness

# Full pre-release Playwright suite. Runs against the isolated staging Worker
# using seeded role accounts. Uploads Playwright traces, screenshots, videos,
# and the HTML report as artifacts.
#
# Trigger manually via workflow_dispatch, or on a schedule (nightly).
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Override PLAYWRIGHT_BASE_URL (defaults to direct staging Worker)"
        required: false
        default: ""
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC nightly

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BASE_URL: ${{ github.event.inputs.base_url != '' && github.event.inputs.base_url || 'https://transitionforward-staging.caysi101.workers.dev' }}
      E2E_STUDENT_EMAIL: ${{ secrets.E2E_STUDENT_EMAIL }}
      E2E_STUDENT_PASSWORD: ${{ secrets.E2E_STUDENT_PASSWORD }}
      E2E_STUDENT_TOTP_SECRET: ${{ secrets.E2E_STUDENT_TOTP_SECRET }}
      E2E_PARENT_EMAIL: ${{ secrets.E2E_PARENT_EMAIL }}
      E2E_PARENT_PASSWORD: ${{ secrets.E2E_PARENT_PASSWORD }}
      E2E_PARENT_TOTP_SECRET: ${{ secrets.E2E_PARENT_TOTP_SECRET }}
      E2E_EDUCATOR_EMAIL: ${{ secrets.E2E_EDUCATOR_EMAIL }}
      E2E_EDUCATOR_PASSWORD: ${{ secrets.E2E_EDUCATOR_PASSWORD }}
      E2E_EDUCATOR_TOTP_SECRET: ${{ secrets.E2E_EDUCATOR_TOTP_SECRET }}
      E2E_SCHOOL_ADMIN_EMAIL: ${{ secrets.E2E_SCHOOL_ADMIN_EMAIL }}
      E2E_SCHOOL_ADMIN_PASSWORD: ${{ secrets.E2E_SCHOOL_ADMIN_PASSWORD }}
      E2E_SCHOOL_ADMIN_TOTP_SECRET: ${{ secrets.E2E_SCHOOL_ADMIN_TOTP_SECRET }}
      E2E_DISTRICT_ADMIN_EMAIL: ${{ secrets.E2E_DISTRICT_ADMIN_EMAIL }}
      E2E_DISTRICT_ADMIN_PASSWORD: ${{ secrets.E2E_DISTRICT_ADMIN_PASSWORD }}
      E2E_DISTRICT_ADMIN_TOTP_SECRET: ${{ secrets.E2E_DISTRICT_ADMIN_TOTP_SECRET }}
      E2E_PARTNER_EMAIL: ${{ secrets.E2E_PARTNER_EMAIL }}
      E2E_PARTNER_PASSWORD: ${{ secrets.E2E_PARTNER_PASSWORD }}
      E2E_PARTNER_TOTP_SECRET: ${{ secrets.E2E_PARTNER_TOTP_SECRET }}
      E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
      E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
      E2E_OWNER_TOTP_SECRET: ${{ secrets.E2E_OWNER_TOTP_SECRET }}
      PLAYWRIGHT_HTML_REPORT: playwright-report
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bun run playwright:install
      - name: Base URL reachability preflight
        if: ${{ env.PLAYWRIGHT_BASE_URL != '' }}
        run: node tests/e2e/scripts/check-base-url.mjs
      - name: Per-role auth setup (skips roles without credentials)
        run: bunx playwright test --project=dashboard-setup
      - name: Public release-readiness, accessibility, visual regression
        run: bunx playwright test --project=release-public --reporter=list,html
      - name: Signed-in role journeys, access control, workflows
        run: bunx playwright test --project=release-signedin --reporter=list,html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-traces-and-media
          path: |
            test-results/
            tests/e2e/release-readiness/**/__screenshots__/
          retention-days: 30
