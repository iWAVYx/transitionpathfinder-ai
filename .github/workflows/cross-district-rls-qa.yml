name: Cross-district RLS QA

on:
  pull_request:
    paths:
      - "tests/cross-district-rls.test.mjs"
      - "supabase/migrations/**"
      - ".github/workflows/cross-district-rls-qa.yml"
  push:
    branches: [main]

jobs:
  cross-district-rls:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install @supabase/supabase-js
        run: npm install --no-save @supabase/supabase-js@^2
      - name: Check live cross-district credentials
        id: live-credentials
        run: |
          if [ -n "$VITE_SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Live cross-district RLS test skipped because Supabase credentials are not available to this run."
          fi
      - name: Run cross-district RLS regression
        if: steps.live-credentials.outputs.ready == 'true'
        run: node --test tests/cross-district-rls.test.mjs
