name: Cross-district RLS QA

on:
  pull_request:
    paths:
      - "tests/cross-district-rls.test.mjs"
      - "supabase/migrations/**"
      - ".github/workflows/cross-district-rls-qa.yml"
  push:
    branches: [main]

jobs:
  cross-district-rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install @supabase/supabase-js
        run: npm install --no-save @supabase/supabase-js@^2
      - name: Run cross-district RLS regression
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node --test tests/cross-district-rls.test.mjs
