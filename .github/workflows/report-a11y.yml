name: Report a11y (axe-core)

on:
  pull_request:
    paths:
      - "src/components/pathway/**"
      - "src/routes/demo_.report.tsx"
      - "src/routes/_authenticated/reports.$reportId.tsx"
      - "src/routes/_authenticated.tsx"
      - "src/routes/_authenticated/security.tsx"
      - "src/routes/login.tsx"
      - "src/routes/login.2fa.tsx"
      - "src/components/site/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - ".github/workflows/report-a11y.yml"
  push:
    branches: [main]

jobs:
  report-a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        timeout-minutes: 10
        run: bun run playwright:install
      - name: Run axe-core report-page suite
        env:
          # Optional — when present, the signed-in /reports/$reportId suite
          # also runs (mobile + tablet + desktop). When absent, only the
          # public /demo/report suite runs.
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_REPORT_ID: ${{ secrets.E2E_REPORT_ID }}
          # Optional — when present, auth.setup completes the 2FA challenge
          # for the test user and the dedicated 2FA spec runs end-to-end.
          E2E_TOTP_SECRET: ${{ secrets.E2E_TOTP_SECRET }}
        run: bunx playwright test tests/e2e/report-a11y.spec.ts tests/e2e/reports-signed-in-a11y.signedin.spec.ts tests/e2e/reports-session-lifecycle.signedin.spec.ts tests/e2e/reports-2fa-challenge.signedin.spec.ts tests/e2e/reports-2fa-rate-limit.signedin.spec.ts tests/e2e/reports-2fa-oauth-aal1.signedin.spec.ts tests/e2e/reports-2fa-oauth-aal2.signedin.spec.ts
