name: Staging Role Verification

# Manual-only, fail-closed verification against the isolated staging Worker.
# Synthetic staging identities are never mixed with production E2E credentials.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "staging" to confirm isolated staging verification'
        required: true
      scope:
        description: 'Full audit, fixed read-only diagnostics, or explicitly confirmed no-AI report fixtures'
        type: choice
        default: all-roles
        options:
          - all-roles
          - partner-demo-plan
          - owner-history-return
          - seven-role-history-return
          - signed-out-history-return
          - report-history-no-ai
      fixture_confirmation:
        description: 'Only report-history-no-ai: type disposable-report-history after explicit owner authorization'
        required: false
        default: ''

concurrency:
  group: staging-role-verification
  cancel-in-progress: true

jobs:
  verify-seven-roles:
    name: Verify Staging Acceptance
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 60
    env:
      STAGING_TEST_SCOPE: ${{ inputs.scope }}
      PLAYWRIGHT_BASE_URL: https://transitionforward-staging.caysi101.workers.dev
      LIVE_VERIFICATION: "true"
      REQUIRE_ALL_ROLES: "true"
      ALLOW_STAGING_OWNER_WITHOUT_TOTP: "true"
      E2E_READ_ONLY: "true"
      E2E_STUDENT_EMAIL: e2e.student@staging.transitionforwardct.test
      E2E_STUDENT_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
      E2E_PARENT_EMAIL: e2e.parent@staging.transitionforwardct.test
      E2E_PARENT_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
      E2E_EDUCATOR_EMAIL: e2e.educator@staging.transitionforwardct.test
      E2E_EDUCATOR_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
      E2E_SCHOOL_ADMIN_EMAIL: e2e.schooladmin@staging.transitionforwardct.test
      E2E_SCHOOL_ADMIN_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
      E2E_DISTRICT_ADMIN_EMAIL: e2e.districtadmin@staging.transitionforwardct.test
      E2E_DISTRICT_ADMIN_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
      E2E_PARTNER_EMAIL: e2e.partner@staging.transitionforwardct.test
      E2E_PARTNER_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
      E2E_OWNER_EMAIL: e2e.owner@staging.transitionforwardct.test
      E2E_OWNER_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}

    steps:
      - name: Confirm staging intent
        env:
          STAGING_INTENT: ${{ inputs.confirm }}
          STAGING_FIXTURE_CONFIRMATION: ${{ inputs.fixture_confirmation }}
        run: |
          if [ "$STAGING_INTENT" != "staging" ]; then
            echo "Confirmation text did not match 'staging'." >&2
            exit 1
          fi
          if [ "$STAGING_TEST_SCOPE" = "report-history-no-ai" ] && [ "$STAGING_FIXTURE_CONFIRMATION" != "disposable-report-history" ]; then
            echo "Explicit disposable report-history fixture confirmation is required." >&2
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Require Isolated Staging Password
        run: |
          if [ -z "$E2E_STUDENT_PASSWORD" ]; then
            echo "::error::STAGING_E2E_PASSWORD is missing from the GitHub staging environment."
            exit 1
          fi
          echo "Shared synthetic staging password is configured."

      - name: Verify Staging Deployment Identity
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          import { createRuntimeSourceFingerprint, runtimeSourceParityErrors } from "./scripts/runtime-source-fingerprint.mjs";
          const base = process.env.PLAYWRIGHT_BASE_URL;
          const response = await fetch(`${base}/api/public/env-health`);
          const body = await response.text();
          if (!response.ok) {
            throw new Error(`env-health returned ${response.status}: ${body.slice(0, 500)}`);
          }
          const health = JSON.parse(body);
          const expectedRef = "qgrertkqbwanerqqemph";
          const expected = createRuntimeSourceFingerprint();
          const errors = runtimeSourceParityErrors({
            expectedFingerprint: expected.fingerprint,
            actualFingerprint: health.runtime_source_fingerprint,
            schema: health.runtime_source_fingerprint_schema,
            algorithm: health.runtime_source_fingerprint_algorithm,
            fileCount: health.runtime_source_file_count,
          });
          if (health.runtime_source_file_count !== expected.fileCount) errors.push("Runtime file count mismatch");
          if (!/^[a-f0-9]{40}$/i.test(health.git_commit_sha ?? "")) errors.push("Exact deployed Git identity is missing");
          if (health.app_env !== "staging") errors.push(`app_env=${health.app_env}`);
          if (health.supabase_project_ref !== expectedRef) {
            errors.push(`supabase_project_ref=${health.supabase_project_ref}`);
          }
          if (health.is_production_project !== false) {
            errors.push(`is_production_project=${health.is_production_project}`);
          }
          if (health.stripe_mode !== "sandbox") errors.push(`stripe_mode=${health.stripe_mode}`);
          if (health.isolation?.ok !== true) {
            errors.push(`isolation=${JSON.stringify(health.isolation)}`);
          }
          console.log(JSON.stringify(health, null, 2));
          if (errors.length) {
            throw new Error(`Staging isolation check failed: ${errors.join(", ")}`);
          }
          appendFileSync(process.env.GITHUB_ENV, `E2E_EXPECTED_BUILD_SHA=${health.git_commit_sha}\nEXPECTED_RUNTIME_SOURCE_FINGERPRINT=${expected.fingerprint}\n`);
          console.log("Exact staging runtime verified; existing role accounts only, no fixture reconciliation.");
          NODE

      - name: E2E Base URL Reachability Preflight
        run: node tests/e2e/scripts/check-base-url.mjs

      - name: Create All Seven Auth Storage States
        run: bunx playwright test --project=dashboard-setup

      - name: Require All Seven Auth Storage States
        id: require-role-states
        run: |
          missing=0
          for role in student parent educator school_admin district_admin partner owner; do
            file="tests/e2e/.auth/${role}.json"
            if [ -s "$file" ]; then
              echo "✓ $role storage state created"
            else
              echo "::error::$role storage state is missing or empty"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Dashboard Regression (Mobile, Tablet, Desktop)
        if: ${{ inputs.scope != 'partner-demo-plan' && inputs.scope != 'owner-history-return' && inputs.scope != 'seven-role-history-return' && inputs.scope != 'signed-out-history-return' && inputs.scope != 'report-history-no-ai' }}
        run: bunx playwright test --project=dashboard-regression --no-deps

      - name: Role Access and Role-Leak Protection
        if: ${{ !cancelled() && steps.require-role-states.outcome == 'success' && inputs.scope != 'report-history-no-ai' }}
        run: |
          if [ "$STAGING_TEST_SCOPE" = "partner-demo-plan" ]; then
            bunx playwright test tests/e2e/demo-roles.signedin.spec.ts --project=role-access --no-deps --retries=0 --grep 'Partner Organization /demo signed-in coverage renders /demo/plan$'
          elif [ "$STAGING_TEST_SCOPE" = "signed-out-history-return" ]; then
            bunx playwright test tests/e2e/public-origin-navigation.spec.ts --project=anon --no-deps --retries=0 --workers=1 --reporter=line,html
          elif [ "$STAGING_TEST_SCOPE" = "seven-role-history-return" ]; then
            bunx playwright test tests/e2e/dashboard-tile-navigation.signedin.spec.ts --project=role-access --no-deps --retries=0 --workers=1 --grep '— actual-source return' --reporter=line,html
          elif [ "$STAGING_TEST_SCOPE" = "owner-history-return" ]; then
            bunx playwright test tests/e2e/dashboard-tile-navigation.signedin.spec.ts --project=role-access --no-deps --retries=0 --workers=1 --grep 'Platform Admin — actual-source return'
          else
            bunx playwright test --project=role-access --no-deps
          fi

      - name: Disposable report history acceptance (no AI)
        if: ${{ !cancelled() && steps.require-role-states.outcome == 'success' && inputs.scope == 'report-history-no-ai' }}
        env:
          RUN_REPORT_HISTORY_STAGING_QA: "true"
          REPORT_HISTORY_FIXTURE_CONFIRMATION: ${{ inputs.fixture_confirmation }}
          REPORT_HISTORY_QA_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: >-
          bunx playwright test tests/e2e/release-readiness/report-history-no-ai.signedin.spec.ts
          --project=release-signedin --no-deps --retries=0 --workers=1

      - name: Remove credential-bearing Playwright artifacts
        id: sanitize-artifacts
        if: always()
        run: node tests/e2e/scripts/sanitize-playwright-artifacts.mjs playwright-report test-results

      - name: Upload Staging Playwright Evidence
        if: ${{ always() && steps.sanitize-artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: staging-role-verification-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn
