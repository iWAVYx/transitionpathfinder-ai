name: Staging Role Verification

# Manual-only, fail-closed verification against the isolated staging Worker.
# Synthetic staging identities are never mixed with production E2E credentials.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "staging" to run all seven roles'
        required: true

concurrency:
  group: staging-role-verification
  cancel-in-progress: true

jobs:
  verify-seven-roles:
    name: Verify All Seven Staging Roles
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BASE_URL: https://transitionforward-staging.caysi101.workers.dev
      LIVE_VERIFICATION: "true"
      REQUIRE_ALL_ROLES: "true"
      ALLOW_STAGING_OWNER_WITHOUT_TOTP: "true"
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      STAGING_E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
      E2E_STUDENT_EMAIL: e2e.student@staging.transitionforwardct.test
      E2E_STUDENT_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
      E2E_PARENT_EMAIL: e2e.parent@staging.transitionforwardct.test
      E2E_PARENT_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
      E2E_EDUCATOR_EMAIL: e2e.educator@staging.transitionforwardct.test
      E2E_EDUCATOR_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
      E2E_SCHOOL_ADMIN_EMAIL: e2e.schooladmin@staging.transitionforwardct.test
      E2E_SCHOOL_ADMIN_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
      E2E_DISTRICT_ADMIN_EMAIL: e2e.districtadmin@staging.transitionforwardct.test
      E2E_DISTRICT_ADMIN_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
      E2E_PARTNER_EMAIL: e2e.partner@staging.transitionforwardct.test
      E2E_PARTNER_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
      E2E_OWNER_EMAIL: e2e.owner@staging.transitionforwardct.test
      E2E_OWNER_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}

    steps:
      - name: Confirm staging intent
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "staging" ]; then
            echo "Confirmation text did not match 'staging'." >&2
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Require Isolated Staging Password
        run: |
          if [ -z "$E2E_STUDENT_PASSWORD" ]; then
            echo "::error::STAGING_E2E_PASSWORD is missing from the GitHub staging environment."
            exit 1
          fi
          echo "Shared synthetic staging password is configured."

      - name: Verify Staging Deployment Identity
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.PLAYWRIGHT_BASE_URL;
          const response = await fetch(`${base}/api/public/env-health`);
          const body = await response.text();
          if (!response.ok) {
            throw new Error(`env-health returned ${response.status}: ${body.slice(0, 500)}`);
          }
          const health = JSON.parse(body);
          const expectedRef = "qgrertkqbwanerqqemph";
          const errors = [];
          if (health.app_env !== "staging") errors.push(`app_env=${health.app_env}`);
          if (health.supabase_project_ref !== expectedRef) {
            errors.push(`supabase_project_ref=${health.supabase_project_ref}`);
          }
          if (health.is_production_project !== false) {
            errors.push(`is_production_project=${health.is_production_project}`);
          }
          if (health.stripe_mode !== "sandbox") errors.push(`stripe_mode=${health.stripe_mode}`);
          if (health.isolation?.ok !== true) {
            errors.push(`isolation=${JSON.stringify(health.isolation)}`);
          }
          console.log(JSON.stringify(health, null, 2));
          if (errors.length) {
            throw new Error(`Staging isolation check failed: ${errors.join(", ")}`);
          }
          console.log("Staging deployment identity verified.");
          NODE

      - name: Reconcile Synthetic Staging Identities
        run: |
          if [ -z "$STAGING_SUPABASE_URL" ]; then
            echo "::error::STAGING_SUPABASE_URL is missing from the GitHub staging environment."
            exit 1
          fi
          if [ -z "$STAGING_SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::STAGING_SUPABASE_SERVICE_ROLE_KEY is missing from the GitHub staging environment."
            exit 1
          fi
          node scripts/seed-staging-identities.mjs

      - name: E2E Base URL Reachability Preflight
        run: node tests/e2e/scripts/check-base-url.mjs

      - name: Create All Seven Auth Storage States
        run: bunx playwright test --project=dashboard-setup

      - name: Require All Seven Auth Storage States
        run: |
          missing=0
          for role in student parent educator school_admin district_admin partner owner; do
            file="tests/e2e/.auth/${role}.json"
            if [ -s "$file" ]; then
              echo "✓ $role storage state created"
            else
              echo "::error::$role storage state is missing or empty"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Dashboard Regression (Mobile, Tablet, Desktop)
        run: bunx playwright test --project=dashboard-regression --no-deps

      - name: Role Access and Role-Leak Protection
        run: bunx playwright test --project=role-access --no-deps

      - name: Upload Staging Playwright Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-role-verification-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn
