name: Production Readiness Audit

# Credential-free static release-control audit. Production secrets must never
# be added to this PR-triggered workflow.
on:
  pull_request:
    paths:
      - ".env*"
      - ".gitignore"
      - ".github/workflows/**"
      - "docs/production-readiness/**"
      - "src/lib/env-identity.ts"
      - "src/lib/owner/testing-scripts.functions.ts"
      - "src/routes/api/public/env-health.ts"
      - "supabase/migrations/**"
      - "tests/production-readiness-contract.test.mjs"
      - "tests/document-storage-transport.test.mjs"
      - "bun.lock"
      - "tests/security-finding-alignment.test.mjs"
      - "tests/unit/env-identity-production.test.ts"
      - "tests/unit/testing-scripts-initialization.test.ts"
      - "package.json"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-audit:
    name: Credential-free Production Readiness Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Verify installed Storage SDK uncertainty contracts without network
        run: node --test tests/document-storage-transport.test.mjs
      - name: Run release-control contract
        run: bun run test:production-readiness
      - name: Run security-finding alignment contract
        run: bun run test:security-findings
      - name: Run production identity unit tests
        run: bunx vitest run tests/unit/env-identity-production.test.ts tests/unit/env-identity-staging.test.ts tests/unit/testing-scripts-initialization.test.ts
