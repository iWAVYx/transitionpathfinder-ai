name: RLS regression QA

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "src/lib/calendar.functions.ts"
      - "src/lib/calendar-events.ts"
      - "src/components/dashboard/DashboardCalendar.tsx"
      - "src/lib/documents.functions.ts"
      - "src/lib/iep-extract.functions.ts"
      - "src/components/pathway/IepUpload.tsx"
      - "tests/calendar-rls.test.mjs"
      - "tests/documents-rls.test.mjs"
      - "tests/iep-upload-signed-url.test.mjs"
      - "tests/iep-signed-url-expiry.test.mjs"
      - "tests/iep-signed-url-revocation.test.mjs"
      - "tests/iep-signed-url-revocation-live.test.mjs"
      - "tests/__snapshots__/calendar-rls-*.snap.json"
      - "tests/__snapshots__/documents-rls-*.snap.json"
      - "tests/__snapshots__/iep-upload-signed-url.snap.json"
      - "tests/rls-demo-isolation.test.mjs"
      - "src/lib/owner/demo-seed.functions.ts"
      - ".github/workflows/calendar-rls-qa.yml"
  push:
    branches: [main]

jobs:
  rls-regression:
    runs-on: ubuntu-latest
    # Requires SUPABASE_DB_URL pointing at a Postgres database that has the
    # current schema migrations applied (staging or an ephemeral CI database).
    # If the secret is absent each suite skips itself rather than failing.
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Supabase test client
        run: npm install --no-save @supabase/supabase-js@^2
      - name: Install psql client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Calendar RLS regression
        run: node --test tests/calendar-rls.test.mjs
      - name: Documents + student-storage RLS regression
        run: node --test tests/documents-rls.test.mjs
      - name: IEP upload + signed-URL access regression
        run: node --test tests/iep-upload-signed-url.test.mjs
      - name: IEP signed-URL TTL expiry regression
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node --test tests/iep-signed-url-expiry.test.mjs
      - name: IEP signed-URL revocation regression (mint-eligibility)
        run: node --test tests/iep-signed-url-revocation.test.mjs
      - name: IEP signed-URL revocation regression (live URL invalidation)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node --test tests/iep-signed-url-revocation-live.test.mjs
      - name: Check demo-isolation credentials
        id: demo-credentials
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$VITE_SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Demo-isolation RLS test skipped because live Supabase credentials are not available to this run."
          fi
      - name: Demo isolation RLS regression (is_demo rows)
        if: steps.demo-credentials.outputs.ready == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: node --test tests/rls-demo-isolation.test.mjs
      - name: How to update snapshots
        if: failure()
        run: |
          echo "::error::An RLS policy snapshot or behavioral matrix drifted."
          echo "If the change is intentional, regenerate the affected snapshot(s) locally with:"
          echo "  UPDATE_SNAPSHOTS=1 node --test tests/calendar-rls.test.mjs"
          echo "  UPDATE_SNAPSHOTS=1 node --test tests/documents-rls.test.mjs"
          echo "  UPDATE_SNAPSHOTS=1 node --test tests/iep-upload-signed-url.test.mjs"
          echo "Then commit tests/__snapshots__/*.snap.json and re-run."
