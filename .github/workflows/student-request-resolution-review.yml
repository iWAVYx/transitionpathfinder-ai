name: Student request resolution
on:
  pull_request:
    paths:
      - "docs/database-proposals/student-request-resolution/**"
      - "tests/database/student-request-resolution*"
      - "tests/database/run-student-request-resolution*"
      - ".github/workflows/student-request-resolution-review.yml"
  push:
    branches: ["codex/ppt-output-quality-print"]
    paths:
      - "docs/database-proposals/student-request-resolution/**"
      - "tests/database/student-request-resolution*"
      - "tests/database/run-student-request-resolution*"
      - ".github/workflows/student-request-resolution-review.yml"
permissions:
  contents: read
jobs:
  targeted-local-database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned disposable WASM PostgreSQL
        run: npm install --prefix "$RUNNER_TEMP/tf-summary-scope-pglite" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8
      - name: Reproduce the old boundary and test the separate correction
        run: |
          export STUDENT_SETUP_MODULE="$RUNNER_TEMP/tf-summary-scope-pglite/node_modules/@electric-sql/pglite/dist/index.js"
          node --test tests/database/student-request-resolution.test.mjs

  targeted-native-database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: supabase/postgres:15.8.1.020
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: supabase_admin
      STUDENT_SETUP_DISPOSABLE: "1"
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned disposable native driver
        run: npm install --prefix "$RUNNER_TEMP/tf-summary-scope-pg" --ignore-scripts --no-audit --no-fund pg@8.16.3
      - name: Verify fresh-database native delete and observed-lock cases
        run: |
          set -euo pipefail
          mkdir -p /tmp/student-request-resolution-native
          export STUDENT_SETUP_NATIVE=1
          export STUDENT_SETUP_MODULE="$RUNNER_TEMP/tf-summary-scope-pg/node_modules/pg/lib/index.js"
          node --test tests/database/student-request-resolution.test.mjs | tee /tmp/student-request-resolution-native/native.tap
      - name: Retain native results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-request-resolution-native
          path: /tmp/student-request-resolution-native
          if-no-files-found: error

  full-schema-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: supabase/postgres:15.8.1.020
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      DOCUMENT_GRANT_SCHEMA_SERVICE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require unchanged original SQL and regression baseline
        run: node tests/database/verify-owner-apply-recovery-baseline.mjs /tmp/document-grant-original-baseline.json
      - name: Install disposable catalog driver
        run: npm install --prefix "$RUNNER_TEMP/pathway-history-tests" --ignore-scripts --no-save --package-lock=false pg@8.16.3
      - name: Execute every existing full schema install and catalog stage
        run: node tests/database/run-document-grant-full-schema.mjs /tmp/document-grant-full-chain
      - name: Install and verify the separate parent-binding draft
        env:
          DOCUMENT_PARENT_SCHEMA_SERVICE: "1"
          DOCUMENT_PARENT_PG_MODULE: ${{ runner.temp }}/pathway-history-tests/node_modules/pg/lib/index.js
        run: node tests/database/run-document-permission-parent-schema.mjs /tmp/document-permission-parent-schema
      - name: Install and verify the third original-file grant draft
        env:
          DOCUMENT_ORIGINAL_SCHEMA_SERVICE: "1"
          DOCUMENT_ORIGINAL_PG_MODULE: ${{ runner.temp }}/pathway-history-tests/node_modules/pg/lib/index.js
        run: node tests/database/run-document-original-access-schema.mjs /tmp/document-original-access-schema
      - name: Install and verify the fourth summary-scope draft
        env:
          DOCUMENT_SUMMARY_SCOPE_SCHEMA_SERVICE: "1"
          DOCUMENT_SUMMARY_SCOPE_PG_MODULE: ${{ runner.temp }}/pathway-history-tests/node_modules/pg/lib/index.js
        run: node tests/database/run-document-summary-scope-schema.mjs /tmp/document-summary-scope-schema
      - name: Install and verify the fifth lifecycle draft
        env:
          DOCUMENT_GRANT_LIFECYCLE_SCHEMA_SERVICE: "1"
          DOCUMENT_GRANT_LIFECYCLE_PG_MODULE: ${{ runner.temp }}/pathway-history-tests/node_modules/pg/lib/index.js
        run: node tests/database/run-document-grant-lifecycle-schema.mjs /tmp/document-grant-lifecycle-schema
      - name: Install and verify the sixth legacy visibility and deletion boundary
        env:
          DOCUMENT_LEGACY_PRIVACY_SCHEMA_SERVICE: "1"
          DOCUMENT_LEGACY_PRIVACY_PG_MODULE: ${{ runner.temp }}/pathway-history-tests/node_modules/pg/lib/index.js
        run: node tests/database/run-document-legacy-privacy-schema.mjs /tmp/document-legacy-privacy-schema
      - name: Install and verify the atomic rights review with real-schema smoke checks
        env:
          RIGHTS_REVIEW_SCHEMA_SERVICE: "1"
          RIGHTS_REVIEW_PG_MODULE: ${{ runner.temp }}/pathway-history-tests/node_modules/pg/lib/index.js
        run: node tests/database/run-rights-status-consistency-schema.mjs /tmp/rights-status-consistency-schema
      - name: Install and verify shared roadmap and personal goal progress
        env:
          PROGRESS_REVIEW_SCHEMA_SERVICE: "1"
          PROGRESS_REVIEW_PG_MODULE: ${{ runner.temp }}/pathway-history-tests/node_modules/pg/lib/index.js
        run: node tests/database/run-progress-access-consistency-schema.mjs /tmp/progress-access-consistency-schema
      - name: Install and verify Student Voice saved-answer consistency
        env:
          VOICE_REVIEW_SCHEMA_SERVICE: "1"
          VOICE_REVIEW_PG_MODULE: ${{ runner.temp }}/pathway-history-tests/node_modules/pg/lib/index.js
        run: node tests/database/run-student-voice-consistency-schema.mjs /tmp/student-voice-consistency-schema
      - name: Verify additive action values after the full ten-draft schema
        env:
          ACTION_VALUE_SCHEMA_SERVICE: "1"
          ACTION_VALUE_PG_MODULE: ${{ runner.temp }}/pathway-history-tests/node_modules/pg/lib/index.js
        run: node tests/database/run-action-item-value-compatibility-schema.mjs /tmp/action-item-value-compatibility-schema
      - name: Verify atomic completion after the full eleven-draft schema
        env:
          ACTION_ATOMIC_SCHEMA_SERVICE: "1"
          ACTION_ATOMIC_PG_MODULE: ${{ runner.temp }}/pathway-history-tests/node_modules/pg/lib/index.js
        run: node tests/database/run-action-completion-atomicity-schema.mjs /tmp/action-completion-atomicity-schema
      - name: Verify normal goal and action deletion after the full twelve-draft schema
        env:
          PLANNING_DELETE_SCHEMA_SERVICE: "1"
          PLANNING_DELETE_PG_MODULE: ${{ runner.temp }}/pathway-history-tests/node_modules/pg/lib/index.js
        run: node tests/database/run-planning-record-delete-schema.mjs /tmp/planning-record-delete-schema
      - name: Verify creation and goal status after thirteen separate drafts
        env:
          PLANNING_WRITE_SCHEMA_SERVICE: "1"
          PLANNING_WRITE_PG_MODULE: ${{ runner.temp }}/pathway-history-tests/node_modules/pg/lib/index.js
        run: node tests/database/run-planning-record-write-schema.mjs /tmp/planning-record-write-schema
      - name: Verify atomic student setup and inventory deletion dependencies
        env:
          PLANNING_WRITE_SCHEMA_SERVICE: "1"
          PLANNING_WRITE_PG_MODULE: ${{ runner.temp }}/pathway-history-tests/node_modules/pg/lib/index.js
        run: node tests/database/run-student-creation-atomicity-schema.mjs /tmp/student-creation-atomicity-schema
      - name: Install preceding meeting review draft
        env:
          PLANNING_WRITE_SCHEMA_SERVICE: "1"
          PLANNING_WRITE_PG_MODULE: ${{ runner.temp }}/pathway-history-tests/node_modules/pg/lib/index.js
        run: node tests/database/run-meeting-completion-atomicity-schema.mjs /tmp/meeting-completion-atomicity-schema
      - name: Verify lifecycle recovery and deletion safeguards
        env:
          PLANNING_WRITE_SCHEMA_SERVICE: "1"
          PLANNING_WRITE_PG_MODULE: ${{ runner.temp }}/pathway-history-tests/node_modules/pg/lib/index.js
        run: node tests/database/run-student-lifecycle-recovery-schema.mjs /tmp/student-lifecycle-recovery-schema
      - name: Verify request resolution and exact student cleanup
        env:
          PLANNING_WRITE_SCHEMA_SERVICE: "1"
          PLANNING_WRITE_PG_MODULE: ${{ runner.temp }}/pathway-history-tests/node_modules/pg/lib/index.js
        run: node tests/database/run-student-request-resolution-schema.mjs /tmp/student-request-resolution-schema
      - name: Retain schema integration proof and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-request-resolution-full-chain
          path: |
            /tmp/document-grant-full-chain
            /tmp/document-permission-parent-schema
            /tmp/document-original-access-schema
            /tmp/document-summary-scope-schema
            /tmp/document-grant-lifecycle-schema
            /tmp/document-legacy-privacy-schema
            /tmp/rights-status-consistency-schema
            /tmp/progress-access-consistency-schema
            /tmp/student-voice-consistency-schema
            /tmp/action-item-value-compatibility-schema
            /tmp/action-completion-atomicity-schema
            /tmp/planning-record-delete-schema
            /tmp/planning-record-write-schema
            /tmp/student-creation-atomicity-schema
            /tmp/meeting-completion-atomicity-schema
            /tmp/student-lifecycle-recovery-schema
            /tmp/student-request-resolution-schema
            /tmp/document-grant-original-baseline.json
          if-no-files-found: error
