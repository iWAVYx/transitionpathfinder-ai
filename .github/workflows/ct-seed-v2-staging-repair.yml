name: CT Seed v2 Staging Repair

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-staging:
    name: Repair and verify isolated staging seed
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    env:
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run credential-free repair regression tests
        run: bun run test:ct-seed-v2-repair

      - name: Repair canonical CT Seed v2 staging rows
        run: bun run repair:ct-seed-v2-staging

      - name: Run CT Seed v2 live staging audit
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          REQUIRE_LIVE_CT_SEED_AUDIT: "true"
        run: bun run test:ct-seed-v2
