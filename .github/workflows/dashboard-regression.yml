name: Dashboard regression

on:
  pull_request:
    paths:
      - "src/routes/_authenticated/**"
      - "src/components/**"
      - "src/lib/role-policy.ts"
      - "tests/unit/**"
      - "tests/e2e/auth-roles.setup.ts"
      - "tests/e2e/helpers/roles.ts"
      - "tests/e2e/dashboard-regression.signedin.spec.ts"
      - "vitest.config.ts"
      - "playwright.config.ts"
      - ".github/workflows/dashboard-regression.yml"
  push:
    branches: [main]

jobs:
  # Static, source-only checks: no duplicate <Link to=…> in a dashboard,
  # no obviously dead <Button>, and empty/loading/error states present
  # when the dashboard queries data. Always runs — no secrets required.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Vitest — dashboard static regression
        run: bun run test:unit

  # Browser regression across 7 roles × 3 viewports. Skips automatically
  # for any role whose credentials aren't configured as repo secrets.
  e2e:
    runs-on: ubuntu-latest
    needs: unit
    env:
      PLAYWRIGHT_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_STUDENT_EMAIL: ${{ secrets.E2E_STUDENT_EMAIL }}
      E2E_STUDENT_PASSWORD: ${{ secrets.E2E_STUDENT_PASSWORD }}
      E2E_PARENT_EMAIL: ${{ secrets.E2E_PARENT_EMAIL }}
      E2E_PARENT_PASSWORD: ${{ secrets.E2E_PARENT_PASSWORD }}
      E2E_EDUCATOR_EMAIL: ${{ secrets.E2E_EDUCATOR_EMAIL }}
      E2E_EDUCATOR_PASSWORD: ${{ secrets.E2E_EDUCATOR_PASSWORD }}
      E2E_SCHOOL_ADMIN_EMAIL: ${{ secrets.E2E_SCHOOL_ADMIN_EMAIL }}
      E2E_SCHOOL_ADMIN_PASSWORD: ${{ secrets.E2E_SCHOOL_ADMIN_PASSWORD }}
      E2E_DISTRICT_ADMIN_EMAIL: ${{ secrets.E2E_DISTRICT_ADMIN_EMAIL }}
      E2E_DISTRICT_ADMIN_PASSWORD: ${{ secrets.E2E_DISTRICT_ADMIN_PASSWORD }}
      E2E_PARTNER_EMAIL: ${{ secrets.E2E_PARTNER_EMAIL }}
      E2E_PARTNER_PASSWORD: ${{ secrets.E2E_PARTNER_PASSWORD }}
      E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
      E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Per-role auth setup (skips roles without credentials)
        run: bunx playwright test --project=dashboard-setup
      - name: Dashboard regression
        run: bunx playwright test --project=dashboard-regression
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
